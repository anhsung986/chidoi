<!DOCTYPE html>
<html lang="vi" style="background-color: #ffb3b3;">
<head>
    <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#007bff">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffb3b3">
    <title>Dự Đoán Tình Yêu</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        html, body {
            background-color: #ffb3b3 !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .btn-back {
            align-self: flex-start;
            text-decoration: none;
            color: #ff3b30;
            background: transparent;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid #ff3b30;
            margin-bottom: 20px;
        }

        .btn-back:hover {
            background: #ff3b30;
            color: white;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.5);
            transform: translateX(-3px);
        }

        .main-card {
            position: relative;
            background: #111827;
            border-radius: 24px;
            padding: 30px 25px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }

        .main-card::before, .history-box::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            z-index: -1;
            filter: blur(8px);
            border-radius: 27px;
            animation: steam 20s linear infinite;
            will-change: transform, background-position;
            transform: translateZ(0);
        }

        @keyframes steam {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .card-title {
            margin: 0; 
            font-size: 22px; 
            letter-spacing: 1px;
            font-weight: 600;
            background: linear-gradient(45deg, #ff0055, #00ffd5, #fffb00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-pair {
            display: flex;
            justify-content: center;
            background: #1f2937;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 10px;
            margin: 15px 0;
            transition: 0.3s;
        }
        
        .input-pair:focus-within {
            border-color: #00ffd5;
            box-shadow: 0 0 10px rgba(0, 255, 213, 0.3);
        }

        input[type="number"], input[type="password"] {
            width: 100%;
            border: none;
            outline: none;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: transparent;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        button.btn-main {
            background: linear-gradient(45deg, #ff0055, #7a00ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        button.btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 213, 0.6);
        }

        .history-box {
            position: relative;
            width: 100%;
            max-width: 340px;
            background: #111827;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .history-box::before { border-radius: 23px; }

        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 600;
            color: #00ffd5;
            letter-spacing: 0.5px;
        }

        .btn-delete-selected {
            color: #ff3b30;
            cursor: pointer;
            text-decoration: underline;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .history-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .history-item input[type="checkbox"] {
            margin-right: 12px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #00ffd5;
        }

        .item-info {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #eee;
        }
        .item-info strong { color: #fffb00; }

        #result { 
            font-size: 38px; 
            margin: 15px 0; 
            font-weight: 700; 
            color: #00ffd5; 
            text-shadow: 0 0 15px rgba(0, 255, 213, 0.6); 
        }

        /* KHUNG THÔNG BÁO TỰ ĐỘNG THAY THẾ ALERT & PROMPT */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-card {
            background: #1f2937;
            border: 1px solid #00ffd5;
            padding: 20px;
            border-radius: 18px;
            width: 85%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 213, 0.3);
        }

        .modal-card p {
            font-size: 14px;
            margin-bottom: 15px;
            color: #eee;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-modal {
            background: #ff0055;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-modal.btn-secondary {
            background: #4b5563;
        }
    </style>
</head>
<body>

    <a href="home.html" class="btn-back">⬅ Home</a>

    <div class="main-card">
        <h2 class="card-title">CHỈ SỐ YÊU ❤️</h2>
        
        <div class="input-pair">
            <input type="number" id="d1" placeholder="NGÀY" max="31">
            <span style="color:rgba(255,255,255,0.3)">/</span>
            <input type="number" id="m1" placeholder="THÁNG" max="12">
        </div>
        <div style="font-size: 20px; margin: 5px 0; filter: drop-shadow(0 0 5px #ff0055);">💖</div>
        <div class="input-pair">
            <input type="number" id="d2" placeholder="NGÀY" max="31">
            <span style="color:rgba(255,255,255,0.3)">/</span>
            <input type="number" id="m2" placeholder="THÁNG" max="12">
        </div>
        
        <button class="btn-main" onclick="calculate()">KIỂM TRA NGAY</button>
        <div id="result">??%</div>
    </div>

    <div class="history-box">
        <div class="history-header">
            <span>DANH SÁCH LỊCH SỬ</span>
            <span class="btn-delete-selected" onclick="openDeleteModal()">Xóa lịch sử</span>
        </div>
        <ul class="history-list" id="historyList"></ul>
    </div>

    <!-- CỬA SỔ THÔNG BÁO TỰ TẠO (KHÔNG DÙNG ALERT/PROMPT) -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-card">
            <p id="modalText">Thông báo</p>
            <div id="passwordContainer" class="input-pair" style="display: none; margin-bottom: 15px;">
                <input type="password" id="adminPassInput" placeholder="Nhập mật mã Admin">
            </div>
            <div class="modal-buttons" id="modalButtons">
                <button class="btn-modal" onclick="closeModal()">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_KEY = "sungtuananh";

        window.onload = loadHistory;

        function showCustomAlert(msg) {
            document.getElementById('modalText').innerText = msg;
            document.getElementById('passwordContainer').style.display = 'none';
            document.getElementById('modalButtons').innerHTML = `<button class="btn-modal" onclick="closeModal()">Đóng</button>`;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function calculate() {
            const d1 = document.getElementById('d1').value;
            const m1 = document.getElementById('m1').value;
            const d2 = document.getElementById('d2').value;
            const m2 = document.getElementById('m2').value;

            if (!d1 || !m1 || !d2 || !m2) return showCustomAlert("Vui lòng điền đầy đủ thông tin ngày tháng!");
            
            if (d1 < 1 || d1 > 31 || d2 < 1 || d2 > 31 || m1 < 1 || m1 > 12 || m2 < 1 || m2 > 12) {
                return showCustomAlert("Ngày hoặc tháng nhập vào không hợp lệ!");
            }

            const val1 = parseInt(d1) * 31 + parseInt(m1);
            const val2 = parseInt(d2) * 31 + parseInt(m2);
            
            const sumVal = val1 + val2;
            const diffVal = Math.abs(val1 - val2);
            const prodVal = (val1 * val2) % 997;
            
            let rawScore = (sumVal * 7 + prodVal * 13 - diffVal * 3) % 51;
            let score = 50 + Math.abs(rawScore);
            
            document.getElementById('result').innerText = score + "%";

            let history = JSON.parse(localStorage.getItem('love_v4')) || [];
            let infoKey = `${d1}/${m1} - ${d2}/${m2}`;

            let existingIndex = history.findIndex(item => item.info === infoKey);
            if (existingIndex !== -1) { history.splice(existingIndex, 1); }

            history.unshift({ id: Date.now(), info: infoKey, val: score + "%" });
            localStorage.setItem('love_v4', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('love_v4')) || [];
            
            history = history.map(item => {
                if (item.info.includes('&')) {
                    item.info = item.info.replace('&', '-');
                }
                return item;
            });
            localStorage.setItem('love_v4', JSON.stringify(history));

            list.innerHTML = history.map(item => `
                <li class="history-item">
                    <input type="checkbox" class="del-check" data-id="${item.id}">
                    <div class="item-info">
                        <span>${item.info}</span>
                        <strong>${item.val}</strong>
                    </div>
                </li>
            `).join('');
        }

        function openDeleteModal() {
            const checkboxes = document.querySelectorAll('.del-check:checked');
            if (checkboxes.length === 0) return showCustomAlert("Vui lòng tích chọn mục cần xóa trong danh sách!");

            document.getElementById('modalText').innerText = "XÁC NHẬN ADMIN\nNhập mật mã Quản trị viên để xóa:";
            document.getElementById('adminPassInput').value = "";
            document.getElementById('passwordContainer').style.display = 'flex';
            document.getElementById('modalButtons').innerHTML = `
                <button class="btn-modal btn-secondary" onclick="closeModal()">Hủy</button>
                <button class="btn-modal" onclick="confirmDelete()">Xác nhận</button>
            `;
            document.getElementById('customModal').style.display = 'flex';
        }

        function confirmDelete() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === ADMIN_KEY) {
                const checkboxes = document.querySelectorAll('.del-check:checked');
                let history = JSON.parse(localStorage.getItem('love_v4')) || [];
                const idsToDelete = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));
                let newHistory = history.filter(item => !idsToDelete.includes(item.id));
                localStorage.setItem('love_v4', JSON.stringify(newHistory));
                loadHistory();
                closeModal();
                showCustomAlert("Hệ thống đã xóa dữ liệu thành công.");
            } else {
                showCustomAlert("Mật mã quản trị không chính xác!");
            }
        }
    </script>
</body>
</html>
