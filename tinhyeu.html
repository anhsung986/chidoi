<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Đoán Tình Yêu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .love-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            margin: 0 auto;
        }
        .love-box h2 {
            font-size: 2.5rem;
            color: #db2777;
            margin: 15px 0;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        .love-btn {
            background-color: #db2777;
            width: 100%;
            padding: 10px;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .love-btn:hover {
            background-color: #be185d;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Thanh Sidebar hoặc Menu chính -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="home.html">Trang chủ</a></li>
                <li><a href="canhan.html">Thông tin cá nhân</a></li>
                <li><a href="caidat.html">Cài đặt</a></li>
                <li><a href="thongbao.html">Thông báo</a></li>
                <li><a href="ngayle.html">Các ngày lễ</a></li>
                <li><a href="index.html" class="logout">Đăng xuất</a></li>
            </ul>
        </aside>

        <!-- Nội dung chính -->
        <main class="main-content">
            <header class="content-header">
                <a href="home.html" class="back-btn">⬅ Trang chủ</a>
                <h1>Dự Đoán Tình Yêu</h1>
            </header>
            
            <section class="love-section">
                <div class="love-box">
                    <h3>Tính tỷ lệ hợp nhau</h3>
                    <div class="form-group">
                        <label for="name1">Họ tên người thứ nhất:</label>
                        <input type="text" id="name1" placeholder="Nhập tên...">
                    </div>
                    <div class="form-group">
                        <label for="name2">Họ tên người thứ hai:</label>
                        <input type="text" id="name2" placeholder="Nhập tên...">
                    </div>
                    <button class="love-btn" id="calculateLove">Xem kết quả</button>
                    
                    <div style="margin-top: 20px;">
                        <p>Tỷ lệ tương hợp:</p>
                        <h2 id="loveResult">--%</h2>
                        <p id="loveMessage" style="color: #64748b; font-size: 0.95rem;"></p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Script tính toán tình yêu và đồng bộ -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // 1. Đồng bộ Dark Mode
            const isDarkMode = localStorage.getItem("appDarkMode") === "true";
            if (isDarkMode) {
                document.body.style.backgroundColor = "#0b0f19";
                document.body.style.color = "#f3f4f6";
                document.querySelectorAll('.love-box').forEach(box => {
                    box.style.backgroundColor = "#1e293b";
                    box.style.borderColor = "#334155";
                });
            } else {
                document.body.style.backgroundColor = "";
                document.body.style.color = "";
            }

            // 2. Logic tính toán tình yêu vui
            const btn = document.getElementById("calculateLove");
            const resultEl = document.getElementById("loveResult");
            const msgEl = document.getElementById("loveMessage");

            btn.addEventListener("click", () => {
                const n1 = document.getElementById("name1").value.trim();
                const n2 = document.getElementById("name2").value.trim();

                if (!n1 || !n2) {
                    alert("Vui lòng nhập đầy đủ tên của cả hai người!");
                    return;
                }

                // Thuật toán giả lập dựa trên độ dài chuỗi tên để ra kết quả cố định cho cặp tên đó
                let combined = (n1 + n2).toLowerCase();
                let hash = 0;
                for (let i = 0; i < combined.length; i++) {
                    hash += combined.charCodeAt(i);
                }
                
                const percentage = (hash % 51) + 50; // Cho ra kết quả từ 50% đến 100% cho vui vẻ
                resultEl.innerText = percentage + "%";

                if (percentage >= 90) {
                    msgEl.innerText = "Cặp đôi trời định, cực kỳ tâm đầu ý hợp! ❤️";
                } else if (percentage >= 75) {
                    msgEl.innerText = "Tình yêu tuyệt vời, rất đáng để gìn giữ! 💖";
                } else {
                    msgEl.innerText = "Cần thêm thời gian thấu hiểu và sẻ chia nhé! ✨";
                }
            });
        });
    </script>
</body>
</html>
