<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Đếm Số Ngày</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .counter-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .counter-box h2 {
            font-size: 2.5rem;
            color: #2563eb;
            margin: 15px 0;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Thanh Sidebar hoặc Menu chính -->
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="home.html">Trang chủ</a></li>
                <li><a href="canhan.html">Thông tin cá nhân</a></li>
                <li><a href="caidat.html">Cài đặt</a></li>
                <li><a href="thongbao.html">Thông báo</a></li>
                <li><a href="ngayle.html">Các ngày lễ</a></li>
                <li><a href="index.html" class="logout">Đăng xuất</a></li>
            </ul>
        </aside>

        <!-- Nội dung chính -->
        <main class="main-content">
            <header class="content-header">
                <a href="home.html" class="back-btn">⬅ Trang chủ</a>
                <h1>Đếm Số Ngày Kỷ Niệm</h1>
            </header>
            
            <section class="counter-section">
                <div class="counter-box">
                    <h3>Chọn mốc thời gian bắt đầu</h3>
                    <div class="form-group" style="max-width: 400px; margin: 15px auto;">
                        <label for="startDate">Ngày bắt đầu:</label>
                        <input type="date" id="startDate">
                    </div>
                    <p>Đã trôi qua:</p>
                    <h2 id="dayCount">0</h2>
                    <p>ngày kể từ mốc thời gian này.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Script tính toán số ngày và đồng bộ -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // 1. Đồng bộ Dark Mode
            const isDarkMode = localStorage.getItem("appDarkMode") === "true";
            if (isDarkMode) {
                document.body.style.backgroundColor = "#0b0f19";
                document.body.style.color = "#f3f4f6";
                // Điều chỉnh màu nền box cho Dark Mode nếu cần
                document.querySelectorAll('.counter-box').forEach(box => {
                    box.style.backgroundColor = "#1e293b";
                    box.style.borderColor = "#334155";
                });
            } else {
                document.body.style.backgroundColor = "";
                document.body.style.color = "";
            }

            // 2. Logic tính số ngày
            const startDateInput = document.getElementById("startDate");
            const dayCountEl = document.getElementById("dayCount");

            // Lấy ngày đã lưu trước đó hoặc mặc định là ngày hôm nay
            const savedDate = localStorage.getItem("appStartDate") || new Date().toISOString().split('T')[0];
            startDateInput.value = savedDate;
            calculateDays(savedDate);

            startDateInput.addEventListener("change", (e) => {
                const val = e.target.value;
                localStorage.setItem("appStartDate", val);
                calculateDays(val);
            });

            function calculateDays(dateString) {
                const start = new Date(dateString);
                const today = new Date();
                // Đặt lại giờ về 0 để tính chính xác khoảng cách ngày
                start.setHours(0, 0, 0, 0);
                today.setHours(0, 0, 0, 0);
                
                const diffTime = today - start;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                dayCountEl.innerText = diffDays >= 0 ? diffDays : 0;
            }
        });
    </script>
</body>
</html>
