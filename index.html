<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng đến với CHI ĐỘI</title>
    
    <!-- Thêm icon ứng dụng -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .logo-container {
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInLogo 1.2s ease-out forwards;
            text-align: center;
        }
        .logo-container img {
            width: 180px;  /* Đã phóng to kích thước chiều rộng logo */
            height: 180px; /* Đã phóng to kích thước chiều cao logo */
            object-fit: contain;
            border-radius: 36px;
            box-shadow: 0 15px 40px rgba(0, 255, 213, 0.3);
        }
        /* Style cho chữ dự phòng nếu ảnh lỗi */
        .fallback-text {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #ff0000, #00ffd5, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: none; 
        }

        @keyframes fadeInLogo {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar-container {
            width: 300px;
            height: 9px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffd5, #7a00ff);
            border-radius: 4px;
            transition: width 0.15s ease-out;
        }
        .status-text {
            font-size: 14px;
            color: #9ca3af;
            height: 20px;
        }
    </style>
</head>    
<body>

    <!-- Khu vực logo lớn -->
    <div class="logo-container">
        <img src="icon.png" alt="Logo Chi Đội" id="logoImg" onerror="tryAlternativePath()">
        <div class="fallback-text" id="fallbackText">CHI ĐỘI</div>
    </div>
    
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="status-text" id="statusText">Đang tải tài nguyên... 0%</div>

    <script>
        // Hàm dự phòng xử lý nếu đường dẫn tương đối không tìm thấy ảnh
        function tryAlternativePath() {
            const img = document.getElementById('logoImg');
            if (!img.dataset.retried) {
                img.dataset.retried = "true";
                img.src = "/chidoi/icon.png";
            } else {
                img.style.display = 'none';
                document.getElementById('fallbackText').style.display = 'block';
            }
        }

        // Đồng bộ màu sắc từ localStorage nếu có
        const savedColor = localStorage.getItem('app_theme_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--app-primary-color', savedColor);
        }

        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        
        let progress = 0;

        // Đặt thời gian delay 5 giây (5000ms) ở mức 0%
        const initialDelay = 5000;

        setTimeout(() => {
            const timer = setInterval(() => {
                // Tăng ngẫu nhiên từng bước từ 1 đến 8 mỗi nhịp
                progress += Math.floor(Math.random() * 8) + 1;

                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    progressBar.style.width = '100%';
                    statusText.innerText = `Đã tải hoàn tất! 100%`;
                    
                    // Chuyển hướng sang trang auth.html sau khi đạt 100%
                    setTimeout(() => {
                        window.location.href = "auth.html";
                    }, 400);
                    return;
                }

                progressBar.style.width = progress + '%';
                statusText.innerText = `Đang tải tài nguyên... ${progress}%`;

            }, 100);
        }, initialDelay);
    </script>
</body>
</html>
