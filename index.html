<!DOCTYPE html>
<html lang="vi" style="background-color: #0b0f19;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CHI ĐỘI</title>

    <style id="app-cached-font"></style>

    <script>
        // 1. Ép dùng font từ bộ nhớ máy ngay ở 0.000s (Nếu đã lưu từ lần trước)
        (function() {
            const savedFont = localStorage.getItem('app_poppins_base64');
            if (savedFont) {
                document.getElementById('app-cached-font').innerHTML = savedFont;
            }
        })();
    </script>
    
    <style>
        /* Mặc định dùng font máy để giao diện hiện lên TỨC THÌ */
        html, body {
            background-color: #0b0f19 !important;
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff0000, #00ffd5, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-bar-container {
            width: 280px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffd5, #7a00ff);
            border-radius: 4px;
        }

        .status-text {
            font-size: 14px;
            color: #9ca3af;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="logo">CHI ĐỘI</div>
    
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="status-text" id="statusText">Đang tải... 0%</div>

    <script>
        // 2. Chuyển trang NGAY LẬP TỨC (Không để hiệu ứng chờ kéo dài)
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');

        // Bật chuyển trang cực nhanh trong 0.05s
        progressBar.style.width = '100%';
        statusText.innerText = 'Đã tải hoàn tất! 100%';

        // CHUYỂN TRANG THẲNG KHÔNG CHỜ ĐỜI
        setTimeout(() => {
            window.location.href = "auth.html";
        }, 50);

        // 3. Tải font ngầm BÊN TRONG TRANG AUTH (Chạy không chặn luồng màn hình)
        if (!localStorage.getItem('app_poppins_base64')) {
            window.addEventListener('load', () => {
                navigator.sendBeacon && navigator.sendBeacon('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
            });
        }
    </script>
</body>
</html>
