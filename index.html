<!DOCTYPE html>
<html lang="vi" style="background-color: #0b0f19;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>CHI ĐỘI</title>

    <!-- Thẻ chứa CSS Font được khôi phục từ localStorage -->
    <style id="app-cached-font"></style>

    <script>
        // BƯỚC 1: Nếu đã có font lưu từ trước (từ lần 2 trở đi), ép dùng ngay từ 0.001s
        (function() {
            const savedFont = localStorage.getItem('cached_poppins_css');
            if (savedFont) {
                document.getElementById('app-cached-font').innerHTML = savedFont;
            }
        })();
    </script>
    
    <style>
        /* Mặc định ưu tiên Poppins, nếu chưa có sẽ dùng font máy để hiện giao diện ngay lập tức */
        html, body {
            background-color: #0b0f19 !important;
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff0000, #00ffd5, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-bar-container {
            width: 280px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffd5, #7a00ff);
            border-radius: 4px;
            transition: width 0.05s linear;
        }

        .status-text {
            font-size: 14px;
            color: #9ca3af;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="logo">CHI ĐỘI</div>
    
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="status-text" id="statusText">Đang tải... 0%</div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        let progress = 0;

        // BƯỚC 2: Hàm chỉ thực hiện tải Font từ Google sau khi app đã khởi chạy xong
        function loadGoogleFontInBackground() {
            fetch('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap')
                .then(res => res.text())
                .then(cssText => {
                    // Lưu font vào localStorage để phục vụ cho các lần mở app sau
                    localStorage.setItem('cached_poppins_css', cssText);
                })
                .catch(() => {});
        }

        const timer = setInterval(() => {
            progress += Math.floor(Math.random() * 15) + 10;

            if (progress >= 100) {
                progress = 100;
                clearInterval(timer);
                progressBar.style.width = '100%';
                statusText.innerText = `Đã tải hoàn tất! 100%`;
                
                // BƯỚC 3: KHI ĐÃ TẢI XONG 100% VÀ CHUẨN BỊ VÀO APP MỚI BẮT ĐẦU TẢI FONT GOOGLE
                loadGoogleFontInBackground();

                setTimeout(() => {
                    window.location.href = "auth.html";
                }, 100);
                return;
            }

            progressBar.style.width = progress + '%';
            statusText.innerText = `Đang tải... ${progress}%`;

        }, 20);
    </script>
</body>
</html>
