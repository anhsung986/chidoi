<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="CHI ĐỘI">
  <title>Chào mừng đến với CHI ĐỘI</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <!-- Ưu tiên tải logo ngay từ đầu -->
  <link rel="preload" as="image" href="./icon.png" fetchpriority="high">

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0b0f19;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .splash {
      width: min(340px, 82vw);
      text-align: center;
      padding: 24px 0;
    }
    .app-name {
      font-size: clamp(34px, 9vw, 48px);
      font-weight: 800;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 30px;
    }
    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00ffd5, #7a00ff);
      transition: width .08s linear;
      will-change: width;
    }
    .loading-text {
      margin-top: 14px;
      color: #aab2c0;
      font-size: 13px;
      min-height: 20px;
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-fill { transition: none; }
    }
  </style>

  <!-- Không để SDK thông báo chặn việc hiển thị logo hoặc mở ứng dụng -->
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function (OneSignal) {
      try {
        await OneSignal.init({
          appId: "62c6a850-ef65-4fcb-9a8c-608c3f15acc2"
        });
      } catch (error) {
        console.warn("OneSignal chưa khởi tạo được:", error);
      }
    });
  </script>
  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
  ></script>
</head>
<body>
  <main class="splash" aria-label="CHI ĐỘI đang khởi động">
    <div class="app-name">CHI ĐỘI</div>
    <div class="progress-track" role="progressbar" aria-label="Tiến trình khởi động" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="loading-text" id="loadingText">Đang khởi động ứng dụng... 0%</div>
  </main>

  <script>
    // Thanh tiến trình chạy đều, không dùng số ngẫu nhiên và không chờ OneSignal.
    (() => {
      const fill = document.getElementById("progressFill");
      const label = document.getElementById("loadingText");
      const track = document.querySelector('[role="progressbar"]');
      const duration = 1100; // khoảng 1,1 giây
      const startedAt = performance.now();
      let opened = false;

      function openApp() {
        if (opened) return;
        opened = true;
        window.location.replace("./auth.html");
      }

      function update(now) {
        const percent = Math.min(100, Math.round(((now - startedAt) / duration) * 100));
        fill.style.width = percent + "%";
        label.textContent = percent < 100
          ? "Đang khởi động ứng dụng... " + percent + "%"
          : "Đã sẵn sàng! 100%";
        track.setAttribute("aria-valuenow", String(percent));

        if (percent < 100) {
          requestAnimationFrame(update);
        } else {
          setTimeout(openApp, 100);
        }
      }

      requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
