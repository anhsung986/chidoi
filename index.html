<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng đến với CHI ĐỘI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff0000, #00ffd5, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .progress-bar-container {
            width: 280px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffd5, #7a00ff);
            border-radius: 4px;
            transition: width 0.15s ease-out;
        }
        .status-text {
            font-size: 14px;
            color: #9ca3af;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="logo">CHI ĐỘI</div>
    
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="status-text" id="statusText">Đang tải tài nguyên... 0%</div>

    <script>
        // Đồng bộ màu sắc từ localStorage nếu có
        const savedColor = localStorage.getItem('app_theme_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--app-primary-color', savedColor);
        }

        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        
        let progress = 0;

        const timer = setInterval(() => {
            // Tăng ngẫu nhiên từng bước từ 1 đến 8 mỗi nhịp để tạo cảm giác tự nhiên
            progress += Math.floor(Math.random() * 8) + 1;

            if (progress >= 100) {
                progress = 100;
                clearInterval(timer);
                progressBar.style.width = '100%';
                statusText.innerText = `Đã tải hoàn tất! 100%`;
                
                // Chuyển hướng sang trang auth.html sau khi đạt 100%
                setTimeout(() => {
                    window.location.href = "auth.html";
                }, 400);
                return;
            }

            progressBar.style.width = progress + '%';
            statusText.innerText = `Đang tải tài nguyên... ${progress}%`;

        }, 100);
    </script>
</body>
</html>
