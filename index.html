<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Welcome - Chi Đội</title>
    <style>
        /* Thiết lập giao diện với màu sắc tươi sáng, năng động */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            overflow: hidden;
        }

        .welcome-screen {
            width: 100%;
            height: 100%;
            /* Sử dụng nền gradient tươi sáng (Xanh ngọc chuyển sang Tím hồng) */
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #f093fb 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            font-weight: 800;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.3rem;
            color: #f8f9fa;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin: 5px 0;
        }

        .hint-box {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: bounce 2s infinite;
        }

        /* Hiệu ứng nhấp nhô nhẹ cho khung hướng dẫn */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <div class="welcome-screen" id="welcomeBtn">
        <h1>CHI ĐỘI</h1>
        <p>Chào mừng bạn đến với hệ thống website.</p>
        <div class="hint-box">
            👉 Chạm vào bất cứ đâu để tiếp tục
        </div>
    </div>

    <script>
        // Lắng nghe sự kiện click trên toàn bộ màn hình để chuyển sang trang auth
        document.getElementById('welcomeBtn').addEventListener('click', function() {
            window.location.href = 'auth.html'; 
        });
    </script>

</body>
</html>
