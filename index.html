<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Website Chi đội - Trang Chủ</title>
    <style>
        /* Màn hình chờ phong cách game */
        #game-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #fff;
            font-family: inherit;
            transition: opacity 0.5s ease;
        }
        .loader-logo {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff0000, #00ff00, #00ffff, #0000ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 1.5s infinite;
        }
        .progress-bar-container {
            width: 280px;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--app-primary-color, #00d2ff);
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <!-- Màn hình chờ LOAD tài nguyên -->
    <div id="game-loader">
        <div class="loader-logo">CHI ĐỘI</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Đang tải tài nguyên... 1%</div>
    </div>

    <div class="welcome-container">
        <!-- Tên website chữ cầu vồng -->
        <h1 class="logo">CHI ĐỘI</h1>
        <p class="subtitle" style="margin-bottom: 30px;">
            Chào mừng bạn đến với hệ thống website Chi đội.<br>
            Vui lòng đăng nhập hoặc đăng ký để tiếp tục trải nghiệm.
        </p>
        
        <!-- Các nút bấm chuyển hướng -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <a href="login.html" class="btn">Đăng Nhập</a>
            <a href="register.html" class="btn" style="background: #1e293b; border: 2px solid #334155;">Đăng Ký</a>
        </div>

        <!-- Khối hướng dẫn dạng thẻ bấm để chuyển sang trang huongdan.html -->
        <a href="huongdan.html" class="guide-card-link" style="display: block; margin-top: 25px; text-decoration: none; text-align: left; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 12px; border: 1px dashed #334155;">
            <div style="margin-top: 10px; text-align: center; color: var(--app-primary-color, #00d2ff); font-size: 12px; font-weight: bold;">
                👉 Bấm vào đây để xem chi tiết hướng dẫn
            </div>
        </a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Đồng bộ màu sắc và phông chữ từ localStorage
            const savedColor = localStorage.getItem('app_theme_color');
            if (savedColor) {
                document.documentElement.style.setProperty('--app-primary-color', savedColor);
            }
            const savedFont = localStorage.getItem('app_font_family');
            if (savedFont) {
                document.body.style.fontFamily = savedFont;
            }

            // Logic màn hình chờ với các mốc dừng chính xác
            let progress = 1;
            const bar = document.getElementById('progressBar');
            const text = document.getElementById('progressText');
            const loader = document.getElementById('game-loader');

            function runLoader() {
                if (progress >= 100) {
                    progress = 100;
                    bar.style.width = '100%';
                    text.innerText = `Đang tải tài nguyên... 100%`;
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                        }, 500);
                    }, 300);
                    return;
                }

                bar.style.width = progress + '%';
                text.innerText = `Đang tải tài nguyên... ${progress}%`;

                let stepDelay = 40; // Tốc độ chạy bình thường giữa các %

                // Xử lý các khoảng dừng theo yêu cầu
                if (progress >= 15 && progress < 37) {
                    // Dừng tổng cộng khoảng 16 giây rải đều qua các % từ 15 đến 37
                    stepDelay = 16000 / (37 - 15); 
                } else if (progress === 67 || progress === 69) {
                    stepDelay = 3000; // Dừng tại mốc 67 và 69
                } else if (progress === 88) {
                    stepDelay = 4000; // Dừng tại mốc 88
                } else if (progress === 99) {
                    stepDelay = 2500; // Dừng đúng 25 giây ở mốc 99%
                }

                progress++;
                setTimeout(runLoader, stepDelay);
            }

            // Bắt đầu chạy màn hình chờ
            setTimeout(runLoader, 100);
        });
    </script>
</body>
</html>
