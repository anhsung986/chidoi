<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực - Chidoi</title>
    <style>
        :root {
            --app-primary-color: #00ffd5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .welcome-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: #111827;
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid color-mix(in srgb, var(--app-primary-color) 40%, transparent);
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff416c, var(--app-primary-color), #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-text {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            text-align: center;
        }
        .btn-login {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
        }
        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-register {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-guide {
            background: rgba(255, 255, 255, 0.03);
            color: var(--app-primary-color);
            border: 1px dashed color-mix(in srgb, var(--app-primary-color) 50%, transparent);
            font-size: 13px;
        }
        .btn-guide:hover {
            background: color-mix(in srgb, var(--app-primary-color) 10%, transparent);
        }

        /* Nút Thông báo */
        .btn-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999; /* Đẩy z-index lên cao để tránh bị che */
            padding: 12px 20px;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-notification.not-granted {
            background-color: #dc3545 !important;
        }
        .btn-notification.granted {
            background-color: #28a745 !important;
        }

        /* CSS EMBED MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none; /* Không chặn tương tác khi ẩn */
            transition: all 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto; /* Bật lại tương tác khi modal hiện lên */
        }
        .modal-card {
            background: #1f2937;
            border: 1px solid color-mix(in srgb, var(--app-primary-color) 50%, transparent);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }
        .modal-body {
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.5;
            white-space: pre-line;
            margin-bottom: 20px;
        }
        .modal-btn {
            background: linear-gradient(45deg, #ff416c, var(--app-primary-color));
            color: #0b0f19;
            font-weight: bold;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: 0.2s;
        }
        .modal-btn:hover {
            opacity: 0.9;
        }
    </style>

    <!-- OneSignal SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "43f7f97c-c122-4c0a-aa40-c4b74d80fcbe",
          serviceWorkerPath: "OneSignalSDKWorker.js",
          allowLocalhostAsSecureOrigin: true
        });

        updateNotificationButtonUI(OneSignal);

        OneSignal.Notifications.addEventListener("permissionChange", function() {
            updateNotificationButtonUI(OneSignal);
        });
      });
    </script>
</head>
<body>

    <div class="welcome-container">
        <h1 class="logo">CHI ĐỘI</h1>
        <p class="welcome-text">
            Chào mừng bạn đến với hệ thống website Chi đội.<br>
            Vui lòng đăng nhập hoặc đăng ký để tiếp tục trải nghiệm.
        </p>

        <div class="btn-group">
            <a href="login.html" class="btn btn-login">Đăng Nhập</a>
            <a href="register.html" class="btn btn-register">Đăng Ký</a>
            <a href="huongdan.html" class="btn btn-guide">👉 Bấm vào đây để xem chi tiết hướng dẫn</a>
        </div>
    </div>

    <!-- Nút Bật thông báo -->
    <button id="notif-btn" class="btn-notification not-granted">
      🔔 Bật thông báo Chi Đội
    </button>

    <!-- EMBED POPUP MODAL -->
    <div id="embed-modal" class="modal-overlay">
        <div class="modal-card">
            <div id="modal-icon" class="modal-icon">🔔</div>
            <div id="modal-title" class="modal-title">Thông Báo</div>
            <div id="modal-body" class="modal-body">Nội dung thông báo</div>
            <button class="modal-btn" id="modal-close-btn">Đã Hiểu</button>
        </div>
    </div>

    <script>
        const savedColor = localStorage.getItem('app_theme_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--app-primary-color', savedColor);
        }

        // HÀM HIỂN THỊ EMBED MODAL
        function showEmbedModal(title, text, icon = '🔔') {
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = text;
            document.getElementById('embed-modal').classList.add('active');
        }

        // HÀM ĐÓNG EMBED MODAL
        function closeEmbedModal() {
            document.getElementById('embed-modal').classList.remove('active');
        }

        document.getElementById('modal-close-btn').addEventListener('click', closeEmbedModal);

        // Cập nhật giao diện nút bấm
        function updateNotificationButtonUI(OneSignal) {
            const btn = document.getElementById('notif-btn');
            if (!btn) return;

            const isGranted = OneSignal.Notifications.permission === true || OneSignal.Notifications.permission === "granted";

            if (isGranted) {
                btn.className = "btn-notification granted";
                btn.innerText = "✅ Đã bật thông báo";
            } else {
                btn.className = "btn-notification not-granted";
                btn.innerText = "🔔 Bật thông báo Chi Đội";
            }
        }

        // Bắt sự kiện Click trực tiếp bằng Event Listener
        document.getElementById('notif-btn').addEventListener('click', function() {
            if (!window.OneSignalDeferred) {
                showEmbedModal("Đang Khởi Tạo", "Hệ thống thông báo đang khởi tạo, vui lòng bấm lại sau 2 giây!", "⏳");
                return;
            }

            OneSignalDeferred.push(async function(OneSignal) {
                try {
                    const permission = OneSignal.Notifications.permission;

                    if (permission === true || permission === "granted") {
                        showEmbedModal("Thành Công", "Bạn đã bật thông báo thành công!", "✅");
                        updateNotificationButtonUI(OneSignal);
                        return;
                    }

                    if (permission === "denied") {
                        showEmbedModal(
                            "Quyền Bị Chặn", 
                            "Quyền thông báo đang bị CHẶN trên thiết bị.\n\nVui lòng vào: Cài đặt điện thoại ➔ Ứng dụng ➔ Chi Đội ➔ Thông báo ➔ Bật 'Cho phép thông báo'.", 
                            "🚫"
                        );
                        return;
                    }

                    await OneSignal.Notifications.requestPermission();
                    
                    setTimeout(() => {
                        updateNotificationButtonUI(OneSignal);
                    }, 800);

                } catch (err) {
                    console.error("Lỗi cấp quyền:", err);
                    showEmbedModal(
                        "Hướng Dẫn Cấp Quyền", 
                        "Vui lòng vào Cài đặt điện thoại ➔ Ứng dụng ➔ Chi Đội ➔ Bật quyền Thông báo để nhận tin tức từ Chi Đội!", 
                        "⚙️"
                    );
                }
            });
        });
    </script>
</body>
</html>
