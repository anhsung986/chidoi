<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực - Chidoi</title>

    <!-- Tích hợp OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "62c6a850-ef65-4fcb-9a8c-608c3f15acc2",
        });
      });
    </script>

    <style>
        :root {
            --app-primary-color: #00ffd5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .welcome-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: #111827;
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid color-mix(in srgb, var(--app-primary-color) 40%, transparent);
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff416c, var(--app-primary-color), #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-text {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            text-align: center;
        }
        .btn-login {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
        }
        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-register {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-guide {
            background: rgba(255, 255, 255, 0.03);
            color: var(--app-primary-color);
            border: 1px dashed color-mix(in srgb, var(--app-primary-color) 50%, transparent);
            font-size: 13px;
        }
        .btn-guide:hover {
            background: color-mix(in srgb, var(--app-primary-color) 10%, transparent);
        }

        /* Modal chung (dùng cho Cập nhật phiên bản & Xin quyền thông báo) */
        .custom-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .custom-modal-content {
            background: #111827;
            border: 1px solid var(--app-primary-color);
            border-radius: 20px;
            padding: 25px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,255,213,0.2);
        }
        .custom-modal-content h3 {
            color: var(--app-primary-color);
            margin-bottom: 12px;
            font-size: 20px;
        }
        .custom-modal-content p, .custom-modal-content ul {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: left;
        }
        .custom-modal-content ul {
            padding-left: 20px;
        }
        .custom-modal-content li {
            margin-bottom: 6px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .btn-modal-primary {
            flex: 1;
            background: var(--app-primary-color);
            color: #0b0f19;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-modal-primary:hover { opacity: 0.9; }
        .btn-modal-secondary {
            flex: 1;
            background: rgba(255,255,255,0.05);
            color: #9ca3af;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-modal-secondary:hover { background: rgba(255,255,255,0.1); color: white; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>

    <script>
        const loggedInUser = localStorage.getItem("loggedInUser");
        if (loggedInUser) {
            window.location.href = "home.html";
        }
    </script>
</head>
<body>

    <div class="welcome-container">
        <h1 class="logo">CHI ĐỘI</h1>
        <p class="welcome-text">
            Chào mừng bạn đến với hệ thống của Chi đội.<br>
            Vui lòng đăng nhập hoặc đăng ký để tiếp tục trải nghiệm.
        </p>

        <div class="btn-group">
            <a href="login.html" class="btn btn-login">Đăng Nhập</a>
            <a href="register.html" class="btn btn-register">Đăng Ký</a>
            <a href="huongdan.html" class="btn btn-guide">👉 Bấm vào đây để xem chi tiết hướng dẫn</a>
        </div>
    </div>

    <script>
        // Dòng này sẽ được GitHub Actions tự động thay đổi dựa theo file version.json khi build
        const CURRENT_VERSION = "4.1"; 

        // 1. Kiểm tra cập nhật ứng dụng tự động
        async function checkForUpdates() {
            try {
                const jsonUrl = 'https://raw.githubusercontent.com/anhsung986/chidoi/main/version.json?t=' + new Date().getTime();
                
                const response = await fetch(jsonUrl);
                if (!response.ok) return;
                const data = await response.json();

                if (data.version && data.version !== CURRENT_VERSION) {
                    showUpdateModal(data.version, data.updateUrl);
                }
            } catch (e) {
                console.log("Không thể kiểm tra phiên bản mới:", e);
            }
        }

        function showUpdateModal(newVersion, updateUrl) {
            if (sessionStorage.getItem('skip_update') === 'true') return;

            const modalHtml = `
                <div class="custom-modal" id="updateModal">
                    <div class="custom-modal-content">
                        <h3>✨ Đã có phiên bản mới!</h3>
                        <p style="text-align:center;">Phiên bản mới <b>v${newVersion}</b> đã sẵn sàng. Bạn có muốn tải phiên bản mới không?</p>
                        <div class="modal-actions">
                            <button class="btn-modal-secondary" onclick="dismissUpdate()">Để sau</button>
                            <button class="btn-modal-primary" onclick="doUpdate('${updateUrl}')">Tải ngay</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function dismissUpdate() {
            sessionStorage.setItem('skip_update', 'true');
            const modal = document.getElementById('updateModal');
            if (modal) modal.remove();
        }

        function doUpdate(url) {
            if (url) {
                window.location.href = url;
            } else {
                window.location.reload(true);
            }
        }

        // 2. Yêu cầu cấp quyền thông báo trực tiếp bằng popup đẹp mắt
        function checkAndRequestNotificationPermission() {
            // Kiểm tra xem người dùng đã từ chối trước đó hoặc đã cấp quyền chưa
            if (localStorage.getItem('notification_prompted') === 'true') return;

            const permissionModalHtml = `
                <div class="custom-modal" id="notificationModal">
                    <div class="custom-modal-content">
                        <h3 class="iam-title">Bật thông báo</h3>
                        <ul class="iam-list">
                          <li>Nhận bản tóm tắt những việc bạn đã làm trong tuần qua và mức độ đạt được.</li>
                          <li>Nhận thông báo khi bạn nhận được phản hồi hoặc điểm số.</li>
                          <li>Nhận lời nhắc để hoàn thành các mục tiêu và nhiệm vụ hàng tuần của bạn.</li>
                        </ul>
                        <div class="modal-actions">
                            <button class="btn-modal-secondary" onclick="dismissNotificationPrompt()">Để sau</button>
                            <button class="btn-modal-primary" onclick="requestOneSignalPermission()">Cho phép</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', permissionModalHtml);
        }

        function dismissNotificationPrompt() {
            localStorage.setItem('notification_prompted', 'true');
            const modal = document.getElementById('notificationModal');
            if (modal) modal.remove();
        }

        async function requestOneSignalPermission() {
            localStorage.setItem('notification_prompted', 'true');
            const modal = document.getElementById('notificationModal');
            if (modal) modal.remove();

            window.OneSignalDeferred = window.OneSignalDeferred || [];
            window.OneSignalDeferred.push(async function(OneSignal) {
                try {
                    await OneSignal.Notifications.requestPermission();
                } catch (e) {
                    console.log("Lỗi yêu cầu quyền thông báo:", e);
                }
            });
        }

        // Khởi chạy khi tải trang xong
        window.addEventListener('DOMContentLoaded', () => {
            checkForUpdates();
            // Hiển thị bảng xin quyền thông báo sau khi mở app 1.5 giây
            setTimeout(() => {
                checkAndRequestNotificationPermission();
            }, 1500);
        });

        const savedColor = localStorage.getItem('app_theme_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--app-primary-color', savedColor);
        }
    </script>
</body>
</html>
