<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực - Chidoi</title>
    <style>
        :root {
            --app-primary-color: #00ffd5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .welcome-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: #111827;
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid color-mix(in srgb, var(--app-primary-color) 40%, transparent);
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff416c, var(--app-primary-color), #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-text {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            text-align: center;
        }
        .btn-login {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
        }
        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-register {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-guide {
            background: rgba(255, 255, 255, 0.03);
            color: var(--app-primary-color);
            border: 1px dashed color-mix(in srgb, var(--app-primary-color) 50%, transparent);
            font-size: 13px;
        }
        .btn-guide:hover {
            background: color-mix(in srgb, var(--app-primary-color) 10%, transparent);
        }

        /* Nút Thông báo */
        .btn-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 20px;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* Chưa bật/Chờ xin quyền -> ĐỎ */
        .btn-notification.not-granted {
            background-color: #dc3545 !important;
        }
        /* Đã cho phép -> XANH */
        .btn-notification.granted {
            background-color: #28a745 !important;
        }
    </style>

    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "43f7f97c-c122-4c0a-aa40-c4b74d80fcbe",
          // Đặt đường dẫn Service Worker tương đối để không bị lỗi 404 trên domain phụ
          serviceWorkerPath: "OneSignalSDKWorker.js",
          allowLocalhostAsSecureOrigin: true
        });

        // Cập nhật trạng thái màu sắc ngay khi tải xong
        checkNotificationStatus();

        // Lắng nghe sự thay đổi quyền từ trình duyệt
        OneSignal.Notifications.addEventListener("permissionChange", function() {
            checkNotificationStatus();
        });
      });
    </script>
</head>
<body>

    <div class="welcome-container">
        <h1 class="logo">CHI ĐỘI</h1>
        <p class="welcome-text">
            Chào mừng bạn đến với hệ thống website Chi đội.<br>
            Vui lòng đăng nhập hoặc đăng ký để tiếp tục trải nghiệm.
        </p>

        <div class="btn-group">
            <a href="login.html" class="btn btn-login">Đăng Nhập</a>
            <a href="register.html" class="btn btn-register">Đăng Ký</a>
            <a href="huongdan.html" class="btn btn-guide">👉 Bấm vào đây để xem chi tiết hướng dẫn</a>
        </div>
    </div>

    <!-- Nút Bật thông báo -->
    <button id="notif-btn" onclick="handleNotificationClick()" class="btn-notification not-granted">
      🔔 Bật thông báo Chi Đội
    </button>

    <script>
        // Lấy theme color nếu có
        const savedColor = localStorage.getItem('app_theme_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--app-primary-color', savedColor);
        }

        // Hàm kiểm tra và cập nhật giao diện nút
        function checkNotificationStatus() {
            const btn = document.getElementById('notif-btn');
            if (!btn) return;

            // Kiểm tra quyền Push mặc định của trình duyệt
            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    btn.className = "btn-notification granted";
                    btn.innerText = "✅ Đã bật thông báo";
                } else {
                    btn.className = "btn-notification not-granted";
                    btn.innerText = "🔔 Bật thông báo Chi Đội";
                }
            }
        }

        // Hàm xử lý trực tiếp khi bấm nút
        function handleNotificationClick() {
            const btn = document.getElementById('notif-btn');

            if (!('Notification' in window)) {
                alert("Trình duyệt này không hỗ trợ nhận thông báo!");
                return;
            }

            // Nếu đã được cho phép từ trước
            if (Notification.permission === 'granted') {
                alert("Bạn đã bật thông báo thành công!");
                checkNotificationStatus();
                return;
            }

            // Nếu bị chặn
            if (Notification.permission === 'denied') {
                alert("Bạn đã CHẶN thông báo cho trang này.\n\nHãy bấm vào biểu tượng 🔒 (Ổ khóa) ở thanh địa chỉ web để MỞ LẠI quyền thông báo.");
                return;
            }

            // Gọi xin quyền trực tiếp thông qua trình duyệt Native (Tránh bị chặn Pop-up)
            Notification.requestPermission().then(function(permission) {
                if (permission === 'granted') {
                    // Đồng bộ lại với OneSignal
                    if (window.OneSignalDeferred) {
                        OneSignalDeferred.push(function(OneSignal) {
                            OneSignal.Notifications.requestPermission();
                        });
                    }
                    alert("Cảm ơn bạn đã bật thông báo!");
                }
                checkNotificationStatus();
            });
        }

        // Chạy kiểm tra 1 lần khi load trang
        document.addEventListener("DOMContentLoaded", checkNotificationStatus);
    </script>
</body>
</html>
