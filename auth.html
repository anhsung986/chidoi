<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực - Chidoi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0b0f19;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .welcome-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            background: #111827;
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 255, 213, 0.3);
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff0000, #00ffd5, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-text {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
        .btn-login {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
        }
        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-register {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-guide {
            background: rgba(255, 255, 255, 0.03);
            color: #00ffd5;
            border: 1px dashed rgba(0, 255, 213, 0.3);
            font-size: 13px;
        }
        .btn-guide:hover {
            background: rgba(0, 255, 213, 0.05);
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1 class="logo">CHI ĐỘI</h1>
        <p class="welcome-text">
            Chào mừng bạn đến với hệ thống website Chi đội.<br>
            Vui lòng đăng nhập hoặc đăng ký để tiếp tục trải nghiệm.
        </p>

        <div class="btn-group">
            <a href="login.html" class="btn btn-login">Đăng Nhập</a>
            <a href="register.html" class="btn btn-register">Đăng Ký</a>
            <a href="guide.html" class="btn btn-guide">👉 Bấm vào đây để xem chi tiết hướng dẫn</a>
        </div>
    </div>

    <script>
        // Đồng bộ màu sắc từ localStorage nếu có
        const savedColor = localStorage.getItem('app_theme_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--app-primary-color', savedColor);
        }
    </script>
</body>
</html>
