<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Link Mạng Xã Hội</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #ffb3b3; min-height: 100vh; display: flex; justify-content: center; padding: 20px 15px; }

    .container {
        width: 100%; max-width: 480px; background: #111827;
        border-radius: 28px; padding: 25px 20px; color: white;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; min-height: 500px;
    }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-btn {
        background: rgba(255, 255, 255, 0.1); border: none; color: white;
        padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 14px;
        text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        transition: 0.2s;
    }
    .nav-btn:hover { background: rgba(0, 255, 213, 0.2); color: #00ffd5; }
    .title { font-size: 18px; font-weight: 600; color: #00ffd5; text-align: center; }

    /* Khung Thêm Link */
    .add-link-card {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .add-link-card h3 { font-size: 15px; color: #00ffd5; margin-bottom: 12px; }

    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .custom-input, .custom-select {
        width: 100%; padding: 10px 12px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
        color: white; font-size: 13px; outline: none;
    }
    .custom-select option { background: #1f2937; color: white; }

    .submit-btn {
        width: 100%; background: #00ffd5; color: #111827; border: none;
        padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer;
        margin-top: 5px; transition: 0.2s;
    }
    .submit-btn:hover { background: #00e0bc; }

    /* Danh Sách Link */
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #e5e7eb; }
    .social-item {
        background: rgba(255, 255, 255, 0.05); border-radius: 14px;
        padding: 12px 15px; margin-bottom: 10px; display: flex;
        align-items: center; justify-content: space-between;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .social-info { display: flex; align-items: center; gap: 12px; width: 80%; }
    .platform-icon { font-size: 24px; }
    .details { overflow: hidden; }
    .user-name { font-size: 13px; font-weight: 600; color: #00ffd5; }
    .platform-name { font-size: 11px; color: #888; }
    .social-link {
        display: block; font-size: 12px; color: #38bdf8; text-decoration: none;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .social-link:hover { text-decoration: underline; }

    .delete-btn {
        background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: none;
        width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
        font-size: 14px; display: flex; align-items: center; justify-content: center;
        transition: 0.2s;
    }
    .delete-btn:hover { background: #ff3b30; color: white; }
</style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-bar">
            <a href="mangxahoi.html" class="nav-btn">⬅️ Bảng Tin</a>
            <div class="title">LINK MẠNG XÃ HỘI</div>
            <div style="width: 80px;"></div>
        </div>

        <!-- Khung Thêm Link -->
        <div class="add-link-card">
            <h3>➕ Thêm Link Của Bạn</h3>
            <div class="input-group">
                <label>Nền Tảng</label>
                <select id="platformSelect" class="custom-select">
                    <option value="Facebook">🌐 Facebook</option>
                    <option value="TikTok">🎵 TikTok</option>
                    <option value="Zalo">💬 Zalo</option>
                    <option value="Instagram">📸 Instagram</option>
                    <option value="YouTube">🔴 YouTube</option>
                    <option value="Khác">🔗 Nền tảng khác</option>
                </select>
            </div>
            <div class="input-group">
                <label>Đường Dẫn (URL)</label>
                <input type="url" id="linkInput" class="custom-input" placeholder="https://facebook.com/ten-tai-khoan">
            </div>
            <button class="submit-btn" id="addLinkBtn">Chia Sẻ Link</button>
        </div>

        <!-- Danh Sách MXH -->
        <div class="section-title">👥 Danh Sách Liên Kết Mọi Người</div>
        <div id="socialList">Đang tải danh sách...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, ref, push, onValue, remove 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2qJM8rMWEwCY5aAUJ-EgWc-GFleckSUI",
            authDomain: "mangxahoi-3620c.firebaseapp.com",
            databaseURL: "https://mangxahoi-3620c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mangxahoi-3620c",
            storageBucket: "mangxahoi-3620c.firebasestorage.app",
            messagingSenderId: "794417692508",
            appId: "1:794417692508:web:00a3b6c0a788fe095c4b99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const socialRef = ref(db, "social_links");

        let currentUsername = localStorage.getItem("loggedInUser") || 
                              localStorage.getItem("username") || 
                              localStorage.getItem("user") || 
                              localStorage.getItem("social_username") || 
                              "Thành viên";

        const platformIcons = {
            "Facebook": "📘",
            "TikTok": "🎵",
            "Zalo": "💬",
            "Instagram": "📸",
            "YouTube": "🔴",
            "Khác": "🔗"
        };

        // Thêm Link Mới
        document.getElementById("addLinkBtn").onclick = async () => {
            const platform = document.getElementById("platformSelect").value;
            const url = document.getElementById("linkInput").value.trim();

            if (!url) return alert("Vui lòng nhập đường dẫn!");
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                return alert("Đường dẫn phải bắt đầu bằng http:// hoặc https://");
            }

            try {
                await push(socialRef, {
                    owner: currentUsername,
                    platform: platform,
                    url: url,
                    createdAt: Date.now()
                });
                document.getElementById("linkInput").value = "";
            } catch (err) {
                alert("Lỗi khi thêm link: " + err.message);
            }
        };

        // Đồng Bộ Danh Sách Realtime
        onValue(socialRef, (snapshot) => {
            const listContainer = document.getElementById("socialList");
            listContainer.innerHTML = "";

            if (!snapshot.exists()) {
                listContainer.innerHTML = "<p style='text-align:center; color:#888; font-size:13px;'>Chưa có link mạng xã hội nào được chia sẻ.</p>";
                return;
            }

            const data = snapshot.val();
            const items = [];
            for (let id in data) items.push({ id, ...data[id] });
            items.sort((a, b) => b.createdAt - a.createdAt);

            items.forEach((item) => {
                const icon = platformIcons[item.platform] || "🔗";
                const isOwner = item.owner === currentUsername;
                const deleteBtnHTML = isOwner ? `<button class="delete-btn" onclick="deleteLink('${item.id}')">✕</button>` : "";

                const cardHTML = `
                    <div class="social-item">
                        <div class="social-info">
                            <span class="platform-icon">${icon}</span>
                            <div class="details">
                                <span class="user-name">${escapeHTML(item.owner)}</span>
                                <span class="platform-name">• ${escapeHTML(item.platform)}</span>
                                <a href="${escapeHTML(item.url)}" target="_blank" class="social-link">${escapeHTML(item.url)}</a>
                            </div>
                        </div>
                        ${deleteBtnHTML}
                    </div>
                `;
                listContainer.insertAdjacentHTML("beforeend", cardHTML);
            });
        });

        // Xóa Link (chỉ dành cho chủ sở hữu)
        window.deleteLink = async (id) => {
            if (confirm("Bạn có muốn xóa liên kết này không?")) {
                try {
                    await remove(ref(db, "social_links/" + id));
                } catch (err) {
                    alert("Lỗi khi xóa: " + err.message);
                }
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
