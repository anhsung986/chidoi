<!DOCTYPE html>
<html lang="vi">
<head>
   <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#007bff">
   
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Link Mạng Xã Hội</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #ffb3b3; min-height: 100vh; display: flex; justify-content: center; padding: 20px 15px; }

    .container {
        width: 100%; max-width: 480px; background: #111827;
        border-radius: 28px; padding: 25px 20px; color: white;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; min-height: 500px;
    }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-btn {
        background: rgba(255, 255, 255, 0.1); border: none; color: white;
        padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 14px;
        text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        transition: 0.2s;
    }
    .nav-btn:hover { background: rgba(0, 255, 213, 0.2); color: #00ffd5; }
    .title { font-size: 18px; font-weight: 600; color: #00ffd5; text-align: center; }

    /* Khung Thêm Link */
    .add-link-card {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .add-link-card h3 { font-size: 15px; color: #00ffd5; margin-bottom: 12px; }

    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .custom-input, .custom-select {
        width: 100%; padding: 10px 12px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
        color: white; font-size: 13px; outline: none;
    }
    .custom-select option { background: #1f2937; color: white; }

    .submit-btn {
        width: 100%; background: #00ffd5; color: #111827; border: none;
        padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer;
        margin-top: 5px; transition: 0.2s;
    }
    .submit-btn:hover { background: #00e0bc; }

    /* Embed Card Style */
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #e5e7eb; }
    .embed-card {
        background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px; padding: 14px; margin-bottom: 12px; position: relative;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.2s, border-color 0.2s;
    }
    .embed-card:hover { transform: translateY(-2px); border-color: rgba(0, 255, 213, 0.4); }
    
    .embed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .embed-owner { font-size: 13px; font-weight: 600; color: #00ffd5; display: flex; align-items: center; gap: 6px; }
    .embed-platform { font-size: 11px; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 20px; color: #ccc; }

    .embed-body {
        background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 10px 12px;
        display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.05);
    }
    .embed-icon { font-size: 26px; }
    .embed-details { flex: 1; overflow: hidden; }
    .embed-title { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .embed-url { font-size: 11px; color: #38bdf8; text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    .embed-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .open-link-btn {
        background: #00ffd5; color: #111827; text-decoration: none; font-size: 12px;
        font-weight: 600; padding: 6px 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px;
    }
    .delete-embed-btn {
        background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: none;
        padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500;
        transition: 0.2s;
    }
    .delete-embed-btn:hover { background: #ff3b30; color: white; }

    /* Modal Embed Xác Nhận Xóa */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); display: none; justify-content: center;
        align-items: center; z-index: 1000; backdrop-filter: blur(6px);
    }
    .modal-box {
        background: #1f2937; border-radius: 20px; padding: 22px; width: 85%;
        max-width: 360px; text-align: center; border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; color: #fff; }
    .modal-desc { font-size: 13px; color: #aaa; margin-bottom: 12px; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-cancel { background: #374151; color: white; }
    .btn-cancel:hover { background: #4b5563; }
    .btn-confirm { background: #ff3b30; color: white; }
    .btn-confirm:hover { background: #e02d22; }
</style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-bar">
            <a href="mangxahoi.html" class="nav-btn">⬅️ Bảng Tin</a>
            <div class="title">LINK MẠNG XÃ HỘI</div>
            <div style="width: 80px;"></div>
        </div>

        <!-- Khung Thêm Link -->
        <div class="add-link-card">
            <h3>➕ Thêm Link Của Bạn</h3>
            <div class="input-group">
                <label>Nền Tảng</label>
                <select id="platformSelect" class="custom-select">
                    <option value="Facebook">🌐 Facebook</option>
                    <option value="TikTok">🎵 TikTok</option>
                    <option value="Zalo">💬 Zalo</option>
                    <option value="Instagram">📸 Instagram</option>
                    <option value="YouTube">🔴 YouTube</option>
                    <option value="Khác">🔗 Nền tảng khác</option>
                </select>
            </div>
            <div class="input-group">
                <label>Đường Dẫn (URL)</label>
                <input type="url" id="linkInput" class="custom-input" placeholder="https://facebook.com/ten-tai-khoan">
            </div>
            <div class="input-group">
                <label>Mật Khẩu Bảo Vệ (Tùy chọn)</label>
                <input type="password" id="linkPassword" class="custom-input" placeholder="🔑 Mật khẩu dùng để xóa sau này">
            </div>
            <button class="submit-btn" id="addLinkBtn">Chia Sẻ Link</button>
        </div>

        <!-- Danh Sách MXH (Embed Format) -->
        <div class="section-title">👥 Embed Liên Kết Mọi Người</div>
        <div id="socialList">Đang tải danh sách...</div>
    </div>

    <!-- Modal Embed Xác Nhận Xóa -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <div class="modal-title">🗑️ Xác nhận xóa Embed</div>
            <div id="deleteModalDesc" class="modal-desc">Bạn có chắc chắn muốn xóa liên kết này không?</div>
            <input type="password" id="verifyPasswordInput" class="custom-input" placeholder="🔒 Nhập mật khẩu bài viết..." style="display: none; margin-bottom: 10px;">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="cancelDeleteBtn">Hủy</button>
                <button class="modal-btn btn-confirm" id="confirmDeleteBtn">Xóa Ngay</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, ref, push, onValue, remove 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2qJM8rMWEwCY5aAUJ-EgWc-GFleckSUI",
            authDomain: "mangxahoi-3620c.firebaseapp.com",
            databaseURL: "https://mangxahoi-3620c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mangxahoi-3620c",
            storageBucket: "mangxahoi-3620c.firebasestorage.app",
            messagingSenderId: "794417692508",
            appId: "1:794417692508:web:00a3b6c0a788fe095c4b99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const socialRef = ref(db, "social_links");

        let currentUsername = localStorage.getItem("loggedInUser") || 
                              localStorage.getItem("username") || 
                              localStorage.getItem("user") || 
                              localStorage.getItem("social_username") || 
                              "Thành viên";

        const platformIcons = {
            "Facebook": "📘",
            "TikTok": "🎵",
            "Zalo": "💬",
            "Instagram": "📸",
            "YouTube": "🔴",
            "Khác": "🔗"
        };

        const platformPlaceholders = {
            "Facebook": "https://facebook.com/ten-tai-khoan",
            "TikTok": "https://www.tiktok.com/@username",
            "Zalo": "https://zalo.me/0901234567",
            "Instagram": "https://instagram.com/ten-tai-khoan",
            "YouTube": "https://youtube.com/@ten-kenh",
            "Khác": "https://example.com"
        };

        // Đổi placeholder linh hoạt theo nền tảng được chọn
        document.getElementById("platformSelect").onchange = (e) => {
            const platform = e.target.value;
            document.getElementById("linkInput").placeholder = platformPlaceholders[platform] || "https://...";
        };

        // Hàm kiểm tra URL hợp lệ theo từng nền tảng
        function validatePlatformUrl(platform, url) {
            const rules = {
                "Facebook": /^https?:\/\/(www\.|m\.|web\.)?(facebook\.com|fb\.com)\/.*$/i,
                "TikTok": /^https?:\/\/(www\.|vt\.|vm\.)?tiktok\.com\/.*$/i,
                "Zalo": /^https?:\/\/(www\.)?zalo\.me\/.*$/i,
                "Instagram": /^https?:\/\/(www\.)?(instagram\.com|instagr\.am)\/.*$/i,
                "YouTube": /^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\/.*$/i
            };

            if (rules[platform]) {
                return rules[platform].test(url);
            }
            return true; // Với "Khác"
        }

        // Thêm Link Embed
        document.getElementById("addLinkBtn").onclick = async () => {
            const platform = document.getElementById("platformSelect").value;
            const url = document.getElementById("linkInput").value.trim();
            const password = document.getElementById("linkPassword").value.trim();

            if (!url) return alert("Vui lòng nhập đường dẫn!");
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                return alert("Đường dẫn phải bắt đầu bằng http:// hoặc https://");
            }

            // Kiểm tra định dạng link theo từng nền tảng
            if (!validatePlatformUrl(platform, url)) {
                return alert(`Đường dẫn không khớp với nền tảng ${platform}!\nVí dụ đúng: ${platformPlaceholders[platform]}`);
            }

            try {
                await push(socialRef, {
                    owner: currentUsername,
                    platform: platform,
                    url: url,
                    password: password || null,
                    createdAt: Date.now()
                });
                document.getElementById("linkInput").value = "";
                document.getElementById("linkPassword").value = "";
            } catch (err) {
                alert("Lỗi khi thêm link: " + err.message);
            }
        };

        // Realtime Embed Sync
        let allSocialLinks = {};
        onValue(socialRef, (snapshot) => {
            const listContainer = document.getElementById("socialList");
            listContainer.innerHTML = "";

            if (!snapshot.exists()) {
                listContainer.innerHTML = "<p style='text-align:center; color:#888; font-size:13px;'>Chưa có link mạng xã hội nào được chia sẻ.</p>";
                allSocialLinks = {};
                return;
            }

            allSocialLinks = snapshot.val();
            const items = [];
            for (let id in allSocialLinks) items.push({ id, ...allSocialLinks[id] });
            items.sort((a, b) => b.createdAt - a.createdAt);

            items.forEach((item) => {
                const icon = platformIcons[item.platform] || "🔗";
                const lockBadge = item.password ? `<span title="Có mật khẩu xóa">🔒</span>` : "";

                const embedHTML = `
                    <div class="embed-card">
                        <div class="embed-header">
                            <div class="embed-owner">👤 ${escapeHTML(item.owner)} ${lockBadge}</div>
                            <div class="embed-platform">${icon} ${escapeHTML(item.platform)}</div>
                        </div>
                        <div class="embed-body">
                            <span class="embed-icon">${icon}</span>
                            <div class="embed-details">
                                <div class="embed-title">Trang cá nhân ${escapeHTML(item.platform)}</div>
                                <a href="${escapeHTML(item.url)}" target="_blank" class="embed-url">${escapeHTML(item.url)}</a>
                            </div>
                        </div>
                        <div class="embed-actions">
                            <a href="${escapeHTML(item.url)}" target="_blank" class="open-link-btn">🚀 Truy cập</a>
                            <button class="delete-embed-btn" onclick="openDeleteModal('${item.id}')">🗑️ Xóa</button>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML("beforeend", embedHTML);
            });
        });

        // Quản lý Modal Xóa Embed Tùy Chỉnh
        let deleteTargetId = null;

        window.openDeleteModal = (id) => {
            deleteTargetId = id;
            const target = allSocialLinks[id];
            const passInput = document.getElementById("verifyPasswordInput");
            const desc = document.getElementById("deleteModalDesc");

            passInput.value = "";
            if (target && target.password) {
                desc.innerText = "Liên kết này có mật khẩu bảo vệ. Vui lòng nhập đúng mật khẩu để xóa:";
                passInput.style.display = "block";
            } else {
                desc.innerText = "Bạn có chắc chắn muốn xóa thẻ liên kết này khỏi danh sách không?";
                passInput.style.display = "none";
            }

            document.getElementById("deleteModal").style.display = "flex";
        };

        document.getElementById("cancelDeleteBtn").onclick = () => {
            deleteTargetId = null;
            document.getElementById("deleteModal").style.display = "none";
        };

        document.getElementById("confirmDeleteBtn").onclick = async () => {
            if (!deleteTargetId) return;

            const target = allSocialLinks[deleteTargetId];
            if (target && target.password) {
                const inputPass = document.getElementById("verifyPasswordInput").value.trim();
                if (inputPass !== target.password) {
                    alert("Mật khẩu không đúng!");
                    return;
                }
            }

            try {
                await remove(ref(db, "social_links/" + deleteTargetId));
                deleteTargetId = null;
                document.getElementById("deleteModal").style.display = "none";
            } catch (err) {
                alert("Lỗi khi xóa: " + err.message);
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
