<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0b0f19;
            color: white;
            font-family: var(--app-font-family, 'Segoe UI', sans-serif);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #111827;
            padding: 40px; border-radius: 16px;
            width: 90%; max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 {
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 8px; border: 1px solid #374151;
            background: #1f2937; color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--app-primary-color, #4facfe);
        }
        button {
            width: 100%; padding: 12px; margin-top: 15px;
            background: var(--app-primary-color, linear-gradient(45deg, #4facfe, #00f2fe));
            border: none; border-radius: 8px; color: white;
            font-weight: bold; cursor: pointer;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }

        #custom-toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 14px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            white-space: nowrap;
        }
        #custom-toast.show {
            bottom: 30px;
        }
        #custom-toast.success span {
            color: #4cd137;
        }
        #custom-toast.error span {
            color: #ff4757;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ĐĂNG NHẬP</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Tên đăng nhập (TK)" autocomplete="off">
            <input type="password" id="password" placeholder="Mật khẩu (MK)">
            <button type="submit">Vào Hệ Thống</button>
        </form>
        <p style="margin-top: 25px;">
            Chưa có tài khoản? <a href="register.html" style="font-weight: bold; color: var(--app-primary-color, #00ffff);">Tạo tài khoản ngay</a>
        </p>
        <p style="margin-top: 10px;">
            <a href="auth.html" style="color: inherit; text-decoration: none;">← Quay lại trang chủ</a>
        </p>
    </div>

    <div id="custom-toast"><span id="toast-icon">✨</span> <span id="toast-msg">Thông báo</span></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedColor = localStorage.getItem('app_theme_color');
            if (savedColor) {
                document.documentElement.style.setProperty('--app-primary-color', savedColor);
            }
            const savedFont = localStorage.getItem('app_font_family');
            if (savedFont) {
                document.documentElement.style.setProperty('--app-font-family', savedFont);
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyB0EJxNNis2NB-JjsiihieWVzFYwsgvRi8",
            authDomain: "chidoi.firebaseapp.com",
            databaseURL: "https://chidoi-default-rtdb.firebaseio.com",
            projectId: "chidoi",
            storageBucket: "chidoi.appspot.com",
            messagingSenderId: "523119718926",
            appId: "1:523119718926:web:2dcdd49145b01755ed825f",
            measurementId: "G-RFKJHW3S97"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 🔄 TỰ ĐỘNG KÉO DỮ LIỆU TỪ FIREBASE VỀ MÁY KHI CÓ MẠNG ĐỂ LÀM BỘ ĐỆM OFFLINE
        if (navigator.onLine) {
            database.ref('users').once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    // Lưu toàn bộ danh sách users xuống localStorage làm "file" lưu trữ dự phòng
                    localStorage.setItem('firebase_users_cache', JSON.stringify(snapshot.val()));
                }
            }).catch(err => {
                console.log("Không thể tải cache từ Firebase:", err);
            });
        }

        let toastTimer = null;
        function showToast(message, type = "success") {
            const toast = document.getElementById('custom-toast');
            const msgEl = document.getElementById('toast-msg');
            
            msgEl.innerText = message;
            toast.className = "show " + type;
            
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.className = "";
            }, 2500);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // 1. Kiểm tra mã bí mật quản trị
            if (user === "" && pass === "0011032012") {
                showToast("Xác thực mã bí mật thành công! Đang vào trang quản trị...", "success");
                setTimeout(() => { window.location.href = "settings-app.html"; }, 1000);
                return;
            }

            if (user === "" || pass === "") {
                showToast("Vui lòng điền đầy đủ thông tin đăng nhập!", "error");
                return;
            }

            // Lấy bộ đệm danh sách users đã lưu trong máy
            const cachedUsersStr = localStorage.getItem('firebase_users_cache');
            const cachedUsers = cachedUsersStr ? JSON.parse(cachedUsersStr) : {};

            // 2. KHI MẤT MẠNG: Lôi bộ đệm trong máy ra xử lý ngay lập tức
            if (!navigator.onLine) {
                if (cachedUsers[user] && cachedUsers[user].password === pass) {
                    showToast("Đăng nhập ngoại tuyến thành công! Chào " + user, "success");
                    localStorage.setItem("loggedInUser", user);
                    localStorage.setItem("da_dang_nhap", "true");
                    setTimeout(() => { window.location.href = "home.html"; }, 1000);
                } else {
                    showToast("Mất mạng và tài khoản/mật khẩu không khớp với dữ liệu lưu trong máy!", "error");
                }
                return;
            }

            // 3. KHI CÓ MẠNG: Kiểm tra trực tiếp trên Firebase
            database.ref('users/' + user).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if (userData.password === pass) {
                        showToast("Đăng nhập thành công! Chào mừng " + user, "success");
                        
                        localStorage.setItem("loggedInUser", user);
                        localStorage.setItem("da_dang_nhap", "true");
                        
                        // Cập nhật lại bộ đệm mới nhất vào máy
                        cachedUsers[user] = userData;
                        localStorage.setItem('firebase_users_cache', JSON.stringify(cachedUsers));
                        
                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 1000);
                    } else {
                        showToast("Mật khẩu nhập chưa đúng!", "error");
                    }
                } else {
                    showToast("Tài khoản này không tồn tại!", "error");
                }
            }).catch((error) => {
                // Phòng hờ nếu lúc gọi mạng bị rớt đột ngột, tự động fallback sang bộ đệm máy
                if (cachedUsers[user] && cachedUsers[user].password === pass) {
                    showToast("Đăng nhập thành công bằng dữ liệu lưu trữ máy!", "success");
                    localStorage.setItem("loggedInUser", user);
                    localStorage.setItem("da_dang_nhap", "true");
                    setTimeout(() => { window.location.href = "home.html"; }, 1000);
                } else {
                    showToast("Lỗi kết nối: " + error.message, "error");
                }
            });
        });
    </script>
</body>
</html>
