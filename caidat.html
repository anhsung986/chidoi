<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cài Đặt Hệ Thống - Cầu Vồng</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0; padding: 0; box-sizing: border-box;
        font-family: var(--app-font-family, 'Poppins', sans-serif);
    }

    body {
        background-color: #ffb3b3;
        min-height: 100vh;
        display: flex; justify-content: center; align-items: center;
        overflow-y: auto;
        padding: 40px 15px;
    }

    /* --- MENU BTN --- */
    .menu-btn {
        position: absolute; top: 25px; left: 25px;
        width: 45px; height: 45px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px; cursor: pointer;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
        z-index: 100; transition: 0.3s;
    }
    .menu-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .menu-btn span {
        display: block; width: 22px; height: 3px;
        background: white; border-radius: 2px; transition: 0.3s;
    }
    .menu-btn.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .menu-btn.active span:nth-child(2) { opacity: 0; }
    .menu-btn.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* --- SIDEBAR --- */
    .sidebar {
        position: fixed;
        top: 20px; left: -300px;
        width: 250px; height: auto !important;
        background: #111827;
        border-radius: 12px; padding: 15px; padding-top: 80px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 99;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sidebar.active { left: 20px; }
    .sidebar a {
        display: block; padding: 12px 20px;
        color: #eee; text-decoration: none;
        font-weight: 500; font-size: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.3s;
        border-radius: 6px;
    }
    .sidebar a:hover {
        background: linear-gradient(45deg, #ff0000, #00ffd5, #7a00ff);
        color: white; padding-left: 25px;
    }

    .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        display: none; z-index: 98;
    }
    .overlay.active { display: block; }

    /* --- MAIN CONTAINER --- */
    .container {
        position: relative;
        width: 100%; max-width: 460px;
        background: #111827;
        border-radius: 28px; padding: 35px 25px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        color: white;
    }

    .container::before {
        content: '';
        position: absolute;
        top: -3px; left: -3px; right: -3px; bottom: -3px;
        background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
        background-size: 400%;
        z-index: -1;
        filter: blur(8px);
        border-radius: 31px;
        animation: steam 20s linear infinite;
    }

    @keyframes steam {
        0% { background-position: 0 0; }
        50% { background-position: 400% 0; }
        100% { background-position: 0 0; }
    }

    .title { 
        font-size: 26px; 
        font-weight: 600; 
        margin-bottom: 25px; 
        letter-spacing: 2px;
        text-align: center;
        background: linear-gradient(45deg, #ff0055, #00ffd5, #fffb00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* --- GIAO DIỆN FORM CÀI ĐẶT --- */
    .setting-group {
        margin-bottom: 20px;
    }
    .setting-group label {
        display: block;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 8px;
        font-weight: 500;
    }
    .setting-group input[type="text"], 
    .setting-group select {
        width: 100%; padding: 12px 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white; font-size: 14px;
        outline: none; transition: 0.3s;
    }
    .setting-group input:focus, 
    .setting-group select:focus {
        border-color: var(--app-primary-color, #00ffd5);
        box-shadow: 0 0 10px rgba(0, 255, 213, 0.3);
    }

    .setting-group select option {
        background: #111827;
        color: white;
    }

    .color-presets {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
        margin-top: 10px;
        width: 100%;
    }
    .color-btn {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%; 
        border: 2px solid white; 
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .color-btn:hover { 
        transform: scale(1.1); 
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* NÚT LƯU CÀI ĐẶT NEON */
    .save-btn {
        width: 100%; padding: 14px;
        border: none; border-radius: 14px;
        background: var(--app-primary-color, linear-gradient(45deg, #00ffd5, #7a00ff));
        color: white; font-size: 15px; font-weight: 600;
        cursor: pointer; transition: 0.3s; margin-top: 10px;
    }
    .save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(0, 255, 213, 0.5);
    }
    
    .link-colors-btn {
        display: block; text-align: center; margin-top: 12px;
        padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px;
        color: #00ffd5; text-decoration: none; font-weight: 500; font-size: 14px;
        border: 1px dashed rgba(255,255,255,0.2); transition: 0.3s;
    }
    .link-colors-btn:hover { background: rgba(255,255,255,0.1); }

    /* --- STYLES CHO EMBED MODAL THAY THẾ ALERT/CONFIRM --- */
    .custom-embed-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s ease;
    }
    .custom-embed-overlay.active { opacity: 1; visibility: visible; }
    .custom-embed-card {
        background: #1f2937; border: 1px solid rgba(0, 255, 213, 0.3);
        border-radius: 16px; width: 90%; max-width: 380px; padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 255, 213, 0.2);
        text-align: center; color: white; transform: scale(0.8); transition: 0.3s ease;
    }
    .custom-embed-overlay.active .custom-embed-card { transform: scale(1); }
    .custom-embed-title { font-size: 16px; font-weight: 600; color: #00ffd5; margin-bottom: 10px; }
    .custom-embed-msg { font-size: 13.5px; color: #ddd; margin-bottom: 20px; white-space: pre-wrap; word-break: break-word; }
    .custom-embed-actions { display: flex; justify-content: center; gap: 10px; }
    
    .embed-btn {
        padding: 8px 18px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s;
    }
    .embed-btn-ok { background: linear-gradient(45deg, #00ffd5, #7a00ff); color: white; }
    .embed-btn-cancel { background: rgba(255,255,255,0.1); color: #ccc; }
</style>
</head>
<body>

    <script>
        // Khôi phục màu sắc và phông chữ ngay khi tải trang để tránh chớp màn hình
        const savedColor = localStorage.getItem('app_theme_color');
        if (savedColor) {
            document.documentElement.style.setProperty('--app-primary-color', savedColor);
        }
        const savedFont = localStorage.getItem('app_font_family');
        if (savedFont) {
            document.documentElement.style.setProperty('--app-font-family', savedFont);
        }
    </script>

    <!-- Nút Hamburger Menu điều hướng -->
    <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Thanh Sidebar rút gọn -->
    <div class="sidebar" id="mySidebar">
        <a href="home.html">🏠 Trang chủ</a>
        <a href="canhan.html">👤 Thông tin cá nhân</a>
        <a href="caidat.html">⚙️ Cài đặt</a>
        <a href="thongbao.html">🔔 Thông báo</a>
        <a href="ngayle.html">🥳 Các ngày lễ</a>
        <a href="#" onclick="logout(event)" style="color: #ff3b30; font-weight: 600;">🚪 Thoát hệ thống</a>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- KHUNG FORM CHÍNH -->
    <div class="container">
        <div class="title">CÀI ĐẶT HỆ THỐNG</div>

        <form id="settingsForm" onsubmit="saveSettings(event)">
            <!-- Nhập Tên Hiển Thị -->
            <div class="setting-group">
                <label for="usernameInput">Thay đổi tên hiển thị 👤</label>
                <input type="text" id="usernameInput" required>
            </div>

            <!-- ĐỔI MÀU TOÀN APP -->
            <div class="setting-group">
                <label for="themeColorInput">Màu chủ đạo toàn app (Mã Hex) 🎨</label>
                <input type="text" id="themeColorInput" placeholder="Ví dụ: #FF0000, #00FF00,...">
                
                <div class="color-presets">
                    <div class="color-btn" style="background: #FF0000;" onclick="selectPresetColor('#FF0000')" title="Đỏ"></div>
                    <div class="color-btn" style="background: #00FF00;" onclick="selectPresetColor('#00FF00')" title="Xanh lá"></div>
                    <div class="color-btn" style="background: #00FFFF;" onclick="selectPresetColor('#00FFFF')" title="Xanh ngọc"></div>
                    <div class="color-btn" style="background: #0000FF;" onclick="selectPresetColor('#0000FF')" title="Xanh dương"></div>
                    <div class="color-btn" style="background: #FF00FF;" onclick="selectPresetColor('#FF00FF')" title="Hồng"></div>
                    <div class="color-btn" style="background: #C0C0C0;" onclick="selectPresetColor('#C0C0C0')" title="Bạc"></div>
                </div>

                <a href="colors.html" class="link-colors-btn">👉 Đến trang [COLERS] tìm màu yêu thích</a>
            </div>

            <!-- CHỈNH SỬA PHÔNG CHỮ TOÀN APP -->
            <div class="setting-group">
                <label for="fontSelect">Phông chữ toàn app ✍️</label>
                <select id="fontSelect">
                    <option value="'Poppins', sans-serif">Poppins (Mặc định)</option>
                    <option value="'Segoe UI', sans-serif">Segoe UI</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="Georgia, serif">Georgia</option>
                </select>
            </div>

            <!-- Lựa chọn Ngôn ngữ -->
            <div class="setting-group">
                <label for="languageSelect">Ngôn ngữ hệ thống 🌐</label>
                <select id="languageSelect">
                    <option value="vi">Tiếng Việt</option>
                    <option value="en">English</option>
                </select>
            </div>

            <button type="submit" class="save-btn">Lưu Cài Đặt</button>
        </form>
    </div>

    <!-- KHUNG EMBED MODAL THAY THẾ ALERT VÀ CONFIRM -->
    <div class="custom-embed-overlay" id="customEmbedOverlay">              
        <div class="custom-embed-card">
            <div class="custom-embed-title" id="customEmbedTitle">THÔNG BÁO</div>
            <div class="custom-embed-msg" id="customEmbedMsg">Nội dung thông báo</div>
            <div class="custom-embed-actions">
                <button class="embed-btn embed-btn-cancel" id="customEmbedCancelBtn" style="display: none;">Hủy</button>
                <button class="embed-btn embed-btn-ok" id="customEmbedOkBtn">OK</button>
            </div>
        </div>
    </div>

    <script>
        // HÀM HIỂN THỊ EMBED MODAL TÙY CHỈNH
        const overlay = document.getElementById('customEmbedOverlay');
        const titleEl = document.getElementById('customEmbedTitle');
        const msgEl = document.getElementById('customEmbedMsg');
        const okBtn = document.getElementById('customEmbedOkBtn');
        const cancelBtn = document.getElementById('customEmbedCancelBtn');

        function showEmbedAlert(message, title = "THÔNG BÁO") {
            return new Promise((resolve) => {
                titleEl.textContent = title;
                msgEl.textContent = message;
                cancelBtn.style.display = "none";
                overlay.classList.add('active');

                const handleOk = () => {
                    overlay.classList.remove('active');
                    okBtn.removeEventListener('click', handleOk);
                    resolve(true);
                };
                okBtn.onclick = handleOk;
            });
        }

        function showEmbedConfirm(message, title = "XÁC NHẬN") {
            return new Promise((resolve) => {
                titleEl.textContent = title;
                msgEl.textContent = message;
                cancelBtn.style.display = "inline-block";
                overlay.classList.add('active');

                const handleOk = () => {
                    overlay.classList.remove('active');
                    resolve(true);
                };
                const handleCancel = () => {
                    overlay.classList.remove('active');
                    resolve(false);
                };
                okBtn.onclick = handleOk;
                cancelBtn.onclick = handleCancel;
            });
        }

        // Kiểm tra đăng nhập khi mở trang
        const loggedInUser = localStorage.getItem("loggedInUser");
        if (!loggedInUser) {
            showEmbedAlert("Bạn cần phải đăng nhập trước!").then(() => {
                window.location.href = "login.html"; 
            });
        }

        // Tải các giá trị đã lưu vào form khi khởi tạo
        if (loggedInUser) {
            document.getElementById("usernameInput").value = loggedInUser;
        }
        if (savedColor) {
            document.getElementById("themeColorInput").value = savedColor;
        }
        if (savedFont) {
            document.getElementById("fontSelect").value = savedFont;
        }

        // Chọn nhanh màu có sẵn
        function selectPresetColor(hexCode) {
            document.getElementById("themeColorInput").value = hexCode;
            document.documentElement.style.setProperty('--app-primary-color', hexCode);
        }

        // Hàm xử lý đóng mở thanh Menu trái
        function toggleMenu() {
            const sidebar = document.getElementById("mySidebar");
            const overlayNav = document.getElementById("overlay");
            const menuBtn = document.getElementById("menuBtn");
            
            sidebar.classList.toggle("active");
            overlayNav.classList.toggle("active");
            menuBtn.classList.toggle("active");
        }

        // Lưu lại cài đặt
        async function saveSettings(e) {
            e.preventDefault();
            const newName = document.getElementById("usernameInput").value.trim();
            const customColor = document.getElementById("themeColorInput").value.trim();
            const selectedFont = document.getElementById("fontSelect").value;
            
            if (newName) {
                localStorage.setItem("loggedInUser", newName);
            }
            if (customColor) {
                localStorage.setItem("app_theme_color", customColor);
                document.documentElement.style.setProperty('--app-primary-color', customColor);
            }
            if (selectedFont) {
                localStorage.setItem("app_font_family", selectedFont);
                document.documentElement.style.setProperty('--app-font-family', selectedFont);
            }

            await showEmbedAlert("Đã lưu các tùy chỉnh cài đặt thành công và đồng bộ cho toàn app! ✨");
            window.location.href = "home.html"; 
        }

        async function logout(e) {
            if (e) e.preventDefault();
            const confirmed = await showEmbedConfirm("Bạn có chắc chắn muốn thoát hệ thống không?");
            if (confirmed) {
                localStorage.removeItem("loggedInUser");
                window.location.href = "auth.html"; 
            }
        }
    </script>
</body>
</html>
