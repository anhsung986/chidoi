<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Tin Mạng Xã Hội</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #ffb3b3; min-height: 100vh; display: flex; justify-content: center; padding: 20px 15px; }

    .container {
        width: 100%; max-width: 480px; background: #111827;
        border-radius: 28px; padding: 25px 20px; color: white;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; overflow: hidden;
    }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .menu-toggle-btn {
        background: rgba(255, 255, 255, 0.1); border: none; color: white;
        padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 18px;
    }
    .title { font-size: 22px; font-weight: 600; color: #00ffd5; }

    /* MENU OVERLAY & SIDEBAR (Giao diện giống hệt ảnh) */
    .menu-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6); opacity: 0; visibility: hidden;
        transition: 0.3s ease; z-index: 100; backdrop-filter: blur(2px);
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }

    .side-menu {
        position: absolute; top: 0; left: -100%; width: 75%; height: 100%;
        background: #111827; padding: 25px 20px; z-index: 101;
        transition: 0.3s ease; border-right: 1px solid rgba(255, 255, 255, 0.1);
        display: flex; flex-direction: column; gap: 5px;
    }
    .side-menu.active { left: 0; }

    .close-btn {
        width: 40px; height: 40px; background: rgba(255, 255, 255, 0.1);
        border: none; border-radius: 12px; color: white; font-size: 20px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        margin-bottom: 25px;
    }

    .menu-item {
        display: flex; align-items: center; gap: 15px; padding: 12px 15px;
        color: white; text-decoration: none; font-size: 15px; font-weight: 500;
        border-radius: 12px; transition: 0.2s; cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .menu-item:hover { background: rgba(255, 255, 255, 0.05); }
    .menu-item.logout { color: #ff4d4d; margin-top: auto; border-bottom: none; }

    /* Khung Đăng nhập & Đăng bài */
    .auth-card, .create-post {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .auth-card input, .create-post textarea {
        width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
        color: white; font-size: 14px; outline: none;
    }
    .create-post textarea { height: 80px; resize: none; margin-bottom: 10px; }
    .btn-main {
        background: #00ffd5; color: #111827; border: none; padding: 10px 20px;
        border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%;
    }
    .post-btn { width: auto; float: right; }

    /* Bài viết */
    .post-card {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 15px; position: relative; clear: both;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-info .name { font-weight: 600; font-size: 14px; color: #00ffd5; }
    .user-info .time { font-size: 11px; color: #888; margin-left: 8px; }
    .post-content { font-size: 14px; margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
    .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 16px; }

    /* Custom Embed Modal Xóa */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); display: none; justify-content: center;
        align-items: center; z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-box {
        background: #1f2937; border-radius: 20px; padding: 20px; width: 85%;
        max-width: 360px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #374151; color: white; }
    .btn-confirm { background: #ff3b30; color: white; }
</style>
</head>
<body>

    <div class="container">
        <!-- Thanh Header có Nút Mở Menu -->
        <div class="header-bar">
            <button class="menu-toggle-btn" id="openMenuBtn">☰</button>
            <div class="title">BẢNG TIN FIREBASE</div>
            <div style="width: 30px;"></div>
        </div>

        <!-- MENU LƯỚT RA (SIDEBAR) -->
        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="side-menu" id="sideMenu">
            <button class="close-btn" id="closeMenuBtn">✕</button>
            <a class="menu-item"><span>🏠</span> Trang Chủ</a>
            <a class="menu-item"><span>📻</span> Mạng xã hội</a>
            <a class="menu-item"><span>👤</span> Thông tin cá nhân</a>
            <a class="menu-item"><span>⚙️</span> Cài đặt</a>
            <a class="menu-item"><span>🔔</span> Thông báo</a>
            <a class="menu-item"><span>🥳</span> Các ngày lễ</a>
            <a class="menu-item logout" id="menuLogoutBtn"><span>🚪</span> Thoát hệ thống</a>
        </div>

        <!-- Đăng nhập -->
        <div class="auth-card" id="authSection">
            <input type="text" id="usernameInput" placeholder="Nhập tên đăng nhập...">
            <button class="btn-main" id="loginBtn" style="margin-top: 10px;">Xác nhận Tên</button>
        </div>

        <!-- Đăng bài -->
        <div class="create-post" id="postSection" style="display: none;">
            <textarea id="postInput" placeholder="Bạn đang nghĩ gì thế?..."></textarea>
            <button class="btn-main post-btn" id="postBtn">Đăng bài</button>
            <div style="clear:both;"></div>
        </div>

        <!-- Bảng tin -->
        <div id="newsFeed">Đang tải dữ liệu...</div>
    </div>

    <!-- Modal Xác Nhận Xóa -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <div style="font-weight: 600; font-size: 16px; margin-bottom: 8px;">Xác nhận xóa</div>
            <div style="font-size: 13px; color: #aaa;">Bạn có chắc chắn muốn xóa bài viết này không?</div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="cancelDeleteBtn">Hủy</button>
                <button class="modal-btn btn-confirm" id="confirmDeleteBtn">Xóa</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, ref, push, onValue, remove 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2qJM8rMWEwCY5aAUJ-EgWc-GFleckSUI",
            authDomain: "mangxahoi-3620c.firebaseapp.com",
            databaseURL: "https://mangxahoi-3620c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mangxahoi-3620c",
            storageBucket: "mangxahoi-3620c.firebasestorage.app",
            messagingSenderId: "794417692508",
            appId: "1:794417692508:web:00a3b6c0a788fe095c4b99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, "posts");

        let currentUsername = localStorage.getItem("social_username") || "";
        let deleteTargetId = null;

        // Xử lý bật/tắt Menu Sidebar
        const openMenuBtn = document.getElementById("openMenuBtn");
        const closeMenuBtn = document.getElementById("closeMenuBtn");
        const sideMenu = document.getElementById("sideMenu");
        const menuOverlay = document.getElementById("menuOverlay");

        const toggleMenu = (open) => {
            sideMenu.classList.toggle("active", open);
            menuOverlay.classList.toggle("active", open);
        };

        openMenuBtn.onclick = () => toggleMenu(true);
        closeMenuBtn.onclick = () => toggleMenu(false);
        menuOverlay.onclick = () => toggleMenu(false);

        // Cập nhật trạng thái đăng nhập từ dữ liệu người dùng
        const updateAuthUI = () => {
            if (currentUsername) {
                document.getElementById("authSection").style.display = "none";
                document.getElementById("postSection").style.display = "block";
            } else {
                document.getElementById("authSection").style.display = "block";
                document.getElementById("postSection").style.display = "none";
            }
        };
        updateAuthUI();

        document.getElementById("loginBtn").onclick = () => {
            const name = document.getElementById("usernameInput").value.trim();
            if (!name) return alert("Vui lòng nhập tên!");
            currentUsername = name;
            localStorage.setItem("social_username", name);
            updateAuthUI();
        };

        // Thoát hệ thống từ Menu
        document.getElementById("menuLogoutBtn").onclick = () => {
            localStorage.removeItem("social_username");
            currentUsername = "";
            toggleMenu(false);
            updateAuthUI();
        };

        // Đăng bài viết
        document.getElementById("postBtn").onclick = async () => {
            const content = document.getElementById("postInput").value.trim();
            if (!content) return alert("Nội dung không được để trống!");

            try {
                await push(postsRef, {
                    author: currentUsername,
                    content: content,
                    createdAt: Date.now()
                });
                document.getElementById("postInput").value = "";
            } catch (err) {
                alert("Lỗi đăng bài: " + err.message);
            }
        };

        // Đồng bộ dữ liệu Realtime
        onValue(postsRef, (snapshot) => {
            const feed = document.getElementById("newsFeed");
            feed.innerHTML = "";

            if (!snapshot.exists()) {
                feed.innerHTML = "<p style='text-align:center; color:#888;'>Chưa có bài viết nào.</p>";
                return;
            }

            const postsData = snapshot.val();
            const postsList = [];
            for (let id in postsData) postsList.push({ id, ...postsData[id] });
            postsList.sort((a, b) => b.createdAt - a.createdAt);

            postsList.forEach((post) => {
                const timeStr = new Date(post.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const postHTML = `
                    <div class="post-card">
                        <button class="delete-btn" onclick="openDeleteModal('${post.id}')">✕</button>
                        <div class="user-info">
                            <span class="name">${escapeHTML(post.author)}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                        <div class="post-content">${escapeHTML(post.content)}</div>
                    </div>
                `;
                feed.insertAdjacentHTML("beforeend", postHTML);
            });
        });

        // Embed Modal Xóa
        window.openDeleteModal = (id) => {
            deleteTargetId = id;
            document.getElementById("deleteModal").style.display = "flex";
        };

        document.getElementById("cancelDeleteBtn").onclick = () => {
            deleteTargetId = null;
            document.getElementById("deleteModal").style.display = "none";
        };

        document.getElementById("confirmDeleteBtn").onclick = async () => {
            if (deleteTargetId) {
                await remove(ref(db, "posts/" + deleteTargetId));
                deleteTargetId = null;
                document.getElementById("deleteModal").style.display = "none";
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
