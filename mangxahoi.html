<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Tin Mạng Xã Hội</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #ffb3b3; min-height: 100vh; display: flex; justify-content: center; padding: 20px 15px; }

    .container {
        width: 100%; max-width: 480px; background: #111827;
        border-radius: 28px; padding: 25px 20px; color: white;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; min-height: 500px;
    }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .menu-toggle-btn, .nav-btn {
        background: rgba(255, 255, 255, 0.1); border: none; color: white;
        padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 14px;
        text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
        transition: 0.2s;
    }
    .nav-btn:hover { background: rgba(0, 255, 213, 0.2); color: #00ffd5; }
    .title { font-size: 20px; font-weight: 600; color: #00ffd5; }

    /* POPUP MENU */
    .menu-backdrop {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
        opacity: 0; visibility: hidden; transition: 0.2s ease; z-index: 99;
        border-radius: 28px;
    }
    .menu-backdrop.active { opacity: 1; visibility: visible; }

    .popover-menu {
        position: absolute; top: 15px; left: 15px; width: 220px;
        background: #181f2e; border-radius: 20px; padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        opacity: 0; visibility: hidden; transform: scale(0.95);
        transition: 0.2s ease; z-index: 100;
    }
    .popover-menu.active { opacity: 1; visibility: visible; transform: scale(1); }

    .close-btn {
        width: 36px; height: 36px; background: rgba(255, 255, 255, 0.1);
        border: none; border-radius: 10px; color: white; font-size: 18px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        margin-bottom: 15px;
    }

    .menu-list { display: flex; flex-direction: column; gap: 4px; }
    .menu-item {
        display: flex; align-items: center; gap: 12px; padding: 10px 12px;
        color: white; text-decoration: none; font-size: 14px; font-weight: 500;
        border-radius: 10px; transition: 0.2s; cursor: pointer;
    }
    .menu-item:hover { background: rgba(255, 255, 255, 0.06); }
    .menu-item.logout { color: #ff4d4d; margin-top: 10px; }

    /* Khung Đăng bài */
    .create-post { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 15px; margin-bottom: 20px; }
    .create-post textarea {
        width: 100%; height: 80px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
        padding: 12px; color: white; resize: none; outline: none; font-size: 14px; margin-bottom: 10px;
    }
    .pass-input {
        width: 100%; padding: 8px 12px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
        color: white; font-size: 13px; outline: none; margin-bottom: 10px;
    }
    
    /* Upload Ảnh UI */
    .image-upload-wrapper { margin-bottom: 10px; }
    .upload-label {
        display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
        background: rgba(255, 255, 255, 0.08); border-radius: 10px; font-size: 13px;
        cursor: pointer; border: 1px dashed rgba(255, 255, 255, 0.2); transition: 0.2s;
    }
    .upload-label:hover { background: rgba(255, 255, 255, 0.15); }
    .image-preview-container {
        position: relative; margin-top: 8px; display: none; width: fit-content;
    }
    .image-preview-container img {
        max-width: 100%; max-height: 180px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .remove-img-btn {
        position: absolute; top: -8px; right: -8px; background: #ff3b30; color: white;
        border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .post-btn {
        background: #00ffd5; color: #111827; border: none; padding: 9px 20px;
        border-radius: 10px; font-weight: 600; cursor: pointer; float: right;
    }

    /* Bài viết */
    .post-card {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 15px; position: relative; clear: both;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-info .name { font-weight: 600; font-size: 14px; color: #00ffd5; }
    .user-info .time { font-size: 11px; color: #888; margin-left: 8px; }
    .post-content { font-size: 14px; margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
    .post-image { width: 100%; max-height: 350px; object-fit: cover; border-radius: 12px; margin-top: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 16px; }
    .lock-badge { font-size: 12px; margin-left: 5px; opacity: 0.8; }

    /* Modal Xóa Bài */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); display: none; justify-content: center;
        align-items: center; z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-box {
        background: #1f2937; border-radius: 20px; padding: 20px; width: 85%;
        max-width: 360px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #374151; color: white; }
    .btn-confirm { background: #ff3b30; color: white; }
</style>
</head>
<body>

    <div class="container">
        <!-- Header với Nút Chuyển sang mangxahoi2 -->
        <div class="header-bar">
            <button class="menu-toggle-btn" id="openMenuBtn">☰</button>
            <div class="title">MẠNG XÃ HỘI</div>
            <a href="mangxahoi2.html" class="nav-btn" title="Quản lý link mạng xã hội">🔗 Quản lý MXH</a>
        </div>

        <!-- POPUP MENU -->
        <div class="menu-backdrop" id="menuBackdrop"></div>
        <div class="popover-menu" id="popoverMenu">
            <button class="close-btn" id="closeMenuBtn">✕</button>
            <div class="menu-list">
                <a class="menu-item" href="home.html"><span>🏠</span> Trang Chủ</a>
                <a class="menu-item" href="mangxahoi2.html"><span>🔗</span> Quản lý MXH</a>
                <a class="menu-item"><span>👤</span> Thông tin cá nhân</a>
                <a class="menu-item"><span>⚙️</span> Cài đặt</a>
                <a class="menu-item"><span>🔔</span> Thông báo</a>
                <a class="menu-item"><span>🥳</span> Các ngày lễ</a>
                <a class="menu-item logout" id="menuLogoutBtn"><span>🚪</span> Thoát hệ thống</a>
            </div>
        </div>

        <!-- Khung Đăng Bài -->
        <div class="create-post">
            <div id="userDisplay" style="font-size: 13px; color: #00ffd5; margin-bottom: 8px; font-weight: 500;"></div>
            <textarea id="postInput" placeholder="Bạn đang nghĩ gì thế?..."></textarea>
            
            <div class="image-upload-wrapper">
                <label for="imageInput" class="upload-label">
                    <span>🖼️</span> Thêm ảnh vào bài đăng
                </label>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <div class="image-preview-container" id="previewContainer">
                    <img id="imagePreview" src="" alt="Preview">
                    <button class="remove-img-btn" id="removeImgBtn">✕</button>
                </div>
            </div>

            <input type="password" id="postPassword" class="pass-input" placeholder="🔑 Mật khẩu bảo vệ bài viết (không bắt buộc)">
            <button class="post-btn" id="postBtn">Đăng bài</button>
            <div style="clear:both;"></div>
        </div>

        <!-- Bảng tin -->
        <div id="newsFeed">Đang tải dữ liệu...</div>
    </div>

    <!-- Modal Xác Nhận Xóa & Nhập Mật Khẩu -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <div style="font-weight: 600; font-size: 16px; margin-bottom: 8px;">Xác nhận xóa</div>
            <div id="deleteModalDesc" style="font-size: 13px; color: #aaa; margin-bottom: 10px;">Bạn có chắc chắn muốn xóa bài viết này không?</div>
            <input type="password" id="verifyPasswordInput" class="pass-input" placeholder="🔒 Nhập mật khẩu bài viết để xóa..." style="display: none;">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="cancelDeleteBtn">Hủy</button>
                <button class="modal-btn btn-confirm" id="confirmDeleteBtn">Xóa</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, ref, push, onValue, remove 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2qJM8rMWEwCY5aAUJ-EgWc-GFleckSUI",
            authDomain: "mangxahoi-3620c.firebaseapp.com",
            databaseURL: "https://mangxahoi-3620c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mangxahoi-3620c",
            storageBucket: "mangxahoi-3620c.firebasestorage.app",
            messagingSenderId: "794417692508",
            appId: "1:794417692508:web:00a3b6c0a788fe095c4b99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, "posts");

        let currentUsername = localStorage.getItem("loggedInUser") || 
                              localStorage.getItem("username") || 
                              localStorage.getItem("user") || 
                              localStorage.getItem("social_username") || 
                              "Thành viên";

        document.getElementById("userDisplay").innerText = "Đăng bài với tên: " + currentUsername;

        // Menu Toggle
        const openMenuBtn = document.getElementById("openMenuBtn");
        const closeMenuBtn = document.getElementById("closeMenuBtn");
        const popoverMenu = document.getElementById("popoverMenu");
        const menuBackdrop = document.getElementById("menuBackdrop");

        const toggleMenu = (show) => {
            popoverMenu.classList.toggle("active", show);
            menuBackdrop.classList.toggle("active", show);
        };

        openMenuBtn.onclick = () => toggleMenu(true);
        closeMenuBtn.onclick = () => toggleMenu(false);
        menuBackdrop.onclick = () => toggleMenu(false);

        document.getElementById("menuLogoutBtn").onclick = () => {
            localStorage.removeItem("loggedInUser");
            localStorage.removeItem("username");
            localStorage.removeItem("social_username");
            window.location.href = "home.html";
        };

        // Xem trước ảnh & nén ảnh
        let base64ImageData = null;
        const imageInput = document.getElementById("imageInput");
        const imagePreview = document.getElementById("imagePreview");
        const previewContainer = document.getElementById("previewContainer");
        const removeImgBtn = document.getElementById("removeImgBtn");

        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const maxDim = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);

                    base64ImageData = canvas.toDataURL("image/jpeg", 0.7);
                    imagePreview.src = base64ImageData;
                    previewContainer.style.display = "block";
                };
            };
            reader.readAsDataURL(file);
        };

        removeImgBtn.onclick = () => {
            base64ImageData = null;
            imageInput.value = "";
            previewContainer.style.display = "none";
        };

        // Đăng bài
        document.getElementById("postBtn").onclick = async () => {
            const content = document.getElementById("postInput").value.trim();
            const password = document.getElementById("postPassword").value.trim();

            if (!content && !base64ImageData) return alert("Vui lòng nhập nội dung hoặc thêm ảnh!");

            try {
                await push(postsRef, {
                    author: currentUsername,
                    content: content,
                    imageUrl: base64ImageData || null,
                    password: password || null,
                    createdAt: Date.now()
                });
                document.getElementById("postInput").value = "";
                document.getElementById("postPassword").value = "";
                removeImgBtn.click();
            } catch (err) {
                alert("Lỗi đăng bài: " + err.message);
            }
        };

        // Realtime Data
        let allPosts = {};
        onValue(postsRef, (snapshot) => {
            const feed = document.getElementById("newsFeed");
            feed.innerHTML = "";

            if (!snapshot.exists()) {
                feed.innerHTML = "<p style='text-align:center; color:#888;'>Chưa có bài viết nào.</p>";
                allPosts = {};
                return;
            }

            allPosts = snapshot.val();
            const postsList = [];
            for (let id in allPosts) postsList.push({ id, ...allPosts[id] });
            postsList.sort((a, b) => b.createdAt - a.createdAt);

            postsList.forEach((post) => {
                const timeStr = new Date(post.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const lockIcon = post.password ? `<span class="lock-badge" title="Bài viết có mật khẩu">🔒</span>` : "";
                const imgHTML = post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="Post Image">` : "";

                const postHTML = `
                    <div class="post-card">
                        <button class="delete-btn" onclick="openDeleteModal('${post.id}')">✕</button>
                        <div class="user-info">
                            <span class="name">${escapeHTML(post.author)}</span>${lockIcon}
                            <span class="time">${timeStr}</span>
                        </div>
                        ${post.content ? `<div class="post-content">${escapeHTML(post.content)}</div>` : ''}
                        ${imgHTML}
                    </div>
                `;
                feed.insertAdjacentHTML("beforeend", postHTML);
            });
        });

        // Modal Xóa
        let deleteTargetId = null;

        window.openDeleteModal = (id) => {
            deleteTargetId = id;
            const targetPost = allPosts[id];
            const passInput = document.getElementById("verifyPasswordInput");
            const desc = document.getElementById("deleteModalDesc");

            passInput.value = "";
            if (targetPost && targetPost.password) {
                desc.innerText = "Bài viết này được bảo vệ bởi mật khẩu. Vui lòng nhập đúng mật khẩu để xóa:";
                passInput.style.display = "block";
            } else {
                desc.innerText = "Bạn có chắc chắn muốn xóa bài viết này không?";
                passInput.style.display = "none";
            }

            document.getElementById("deleteModal").style.display = "flex";
        };

        document.getElementById("cancelDeleteBtn").onclick = () => {
            deleteTargetId = null;
            document.getElementById("deleteModal").style.display = "none";
        };

        document.getElementById("confirmDeleteBtn").onclick = async () => {
            if (!deleteTargetId) return;

            const targetPost = allPosts[deleteTargetId];
            if (targetPost && targetPost.password) {
                const inputPass = document.getElementById("verifyPasswordInput").value.trim();
                if (inputPass !== targetPost.password) {
                    alert("Mật khẩu không đúng! Không thể xóa bài viết.");
                    return;
                }
            }

            try {
                await remove(ref(db, "posts/" + deleteTargetId));
                deleteTargetId = null;
                document.getElementById("deleteModal").style.display = "none";
            } catch (err) {
                alert("Lỗi khi xóa bài: " + err.message);
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
