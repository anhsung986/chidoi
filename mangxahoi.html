<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Tin Mạng Xã Hội</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #ffb3b3; min-height: 100vh; display: flex; justify-content: center; padding: 20px 15px; }

    .container {
        width: 100%; max-width: 480px; background: #111827;
        border-radius: 28px; padding: 25px 20px; color: white;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative;
    }

    .header { text-align: center; margin-bottom: 20px; }
    .title { font-size: 24px; font-weight: 600; color: #00ffd5; }
    .user-status { font-size: 13px; color: #888; margin-top: 4px; }

    /* Khung Đăng nhập */
    .auth-card {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .auth-card input {
        width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
        color: white; margin-bottom: 10px; font-size: 14px; outline: none;
    }
    .auth-btn {
        width: 100%; background: #00ffd5; color: #111827; border: none;
        padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }

    /* Khung Đăng bài */
    .create-post { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 15px; margin-bottom: 20px; }
    .create-post textarea {
        width: 100%; height: 80px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
        padding: 12px; color: white; resize: none; outline: none; font-size: 14px;
    }
    .post-btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .logout-link { color: #ff3b30; font-size: 12px; cursor: pointer; text-decoration: underline; }
    .post-btn {
        background: #00ffd5; color: #111827; border: none; padding: 10px 20px;
        border-radius: 10px; font-weight: 600; cursor: pointer;
    }

    /* Bài viết */
    .post-card {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 15px; position: relative; clear: both;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-info .name { font-weight: 600; font-size: 14px; color: #00ffd5; }
    .user-info .time { font-size: 11px; color: #888; margin-left: 8px; }
    .post-content { font-size: 14px; margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
    .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 16px; }

    /* Custom Embed Modal (Bảng xác nhận xóa) */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); display: none; justify-content: center;
        align-items: center; z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-box {
        background: #1f2937; border-radius: 20px; padding: 20px; width: 85%;
        max-width: 360px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 10px; }
    .modal-desc { font-size: 13px; color: #aaa; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-btn {
        flex: 1; padding: 10px; border-radius: 10px; border: none;
        font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn-cancel { background: #374151; color: white; }
    .btn-confirm { background: #ff3b30; color: white; }
</style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">BẢNG TIN FIREBASE</div>
            <div class="user-status" id="userStatus">Chưa đăng nhập</div>
        </div>

        <!-- Khung Đăng nhập (Hiện khi chưa có Tên) -->
        <div class="auth-card" id="authSection">
            <input type="text" id="usernameInput" placeholder="Nhập tên đăng nhập của bạn...">
            <button class="auth-btn" id="loginBtn">Xác nhận Tên</button>
        </div>

        <!-- Khung Đăng bài (Hiện sau khi đã Đăng nhập) -->
        <div class="create-post" id="postSection" style="display: none;">
            <textarea id="postInput" placeholder="Bạn đang nghĩ gì thế?..."></textarea>
            <div class="post-btn-group">
                <span class="logout-link" id="logoutBtn">Đổi tên khác</span>
                <button class="post-btn" id="postBtn">Đăng bài</button>
            </div>
        </div>

        <div id="newsFeed">Đang tải dữ liệu...</div>
    </div>

    <!-- Custom Popup Embed Xóa -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <div class="modal-title">Xác nhận xóa</div>
            <div class="modal-desc">Bạn có chắc chắn muốn xóa bài viết này không?</div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="cancelDeleteBtn">Hủy</button>
                <button class="modal-btn btn-confirm" id="confirmDeleteBtn">Xóa</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, ref, push, onValue, remove 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2qJM8rMWEwCY5aAUJ-EgWc-GFleckSUI",
            authDomain: "mangxahoi-3620c.firebaseapp.com",
            databaseURL: "https://mangxahoi-3620c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mangxahoi-3620c",
            storageBucket: "mangxahoi-3620c.firebasestorage.app",
            messagingSenderId: "794417692508",
            appId: "1:794417692508:web:00a3b6c0a788fe095c4b99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, "posts");

        let currentUsername = localStorage.getItem("social_username") || "";
        let deleteTargetId = null;

        // Xử lý Giao diện Đăng nhập / Đăng xuất
        const updateAuthUI = () => {
            if (currentUsername) {
                document.getElementById("userStatus").innerText = "Đăng nhập bởi: " + currentUsername;
                document.getElementById("authSection").style.display = "none";
                document.getElementById("postSection").style.display = "block";
            } else {
                document.getElementById("userStatus").innerText = "Chưa đăng nhập";
                document.getElementById("authSection").style.display = "block";
                document.getElementById("postSection").style.display = "none";
            }
        };
        updateAuthUI();

        document.getElementById("loginBtn").onclick = () => {
            const name = document.getElementById("usernameInput").value.trim();
            if (!name) return alert("Vui lòng nhập tên!");
            currentUsername = name;
            localStorage.setItem("social_username", name);
            updateAuthUI();
        };

        document.getElementById("logoutBtn").onclick = () => {
            localStorage.removeItem("social_username");
            currentUsername = "";
            updateAuthUI();
        };

        // Đăng bài viết
        document.getElementById("postBtn").onclick = async () => {
            const content = document.getElementById("postInput").value.trim();
            if (!content) return alert("Nội dung không được để trống!");

            try {
                await push(postsRef, {
                    author: currentUsername,
                    content: content,
                    createdAt: Date.now()
                });
                document.getElementById("postInput").value = "";
            } catch (err) {
                alert("Lỗi đăng bài: " + err.message);
            }
        };

        // Lấy dữ liệu Realtime
        onValue(postsRef, (snapshot) => {
            const feed = document.getElementById("newsFeed");
            feed.innerHTML = "";

            if (!snapshot.exists()) {
                feed.innerHTML = "<p style='text-align:center; color:#888;'>Chưa có bài viết nào.</p>";
                return;
            }

            const postsData = snapshot.val();
            const postsList = [];
            for (let id in postsData) postsList.push({ id, ...postsData[id] });
            postsList.sort((a, b) => b.createdAt - a.createdAt);

            postsList.forEach((post) => {
                const timeStr = new Date(post.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const postHTML = `
                    <div class="post-card">
                        <button class="delete-btn" onclick="openDeleteModal('${post.id}')">✕</button>
                        <div class="user-info">
                            <span class="name">${escapeHTML(post.author)}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                        <div class="post-content">${escapeHTML(post.content)}</div>
                    </div>
                `;
                feed.insertAdjacentHTML("beforeend", postHTML);
            });
        });

        // Quản lý Modal Xóa Bài
        window.openDeleteModal = (id) => {
            deleteTargetId = id;
            document.getElementById("deleteModal").style.display = "flex";
        };

        document.getElementById("cancelDeleteBtn").onclick = () => {
            deleteTargetId = null;
            document.getElementById("deleteModal").style.display = "none";
        };

        document.getElementById("confirmDeleteBtn").onclick = async () => {
            if (deleteTargetId) {
                await remove(ref(db, "posts/" + deleteTargetId));
                deleteTargetId = null;
                document.getElementById("deleteModal").style.display = "none";
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
