<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Tin Mạng Xã Hội</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #ffb3b3; min-height: 100vh; display: flex; justify-content: center; padding: 20px 15px; }

    .container {
        width: 100%; max-width: 480px; background: #111827;
        border-radius: 28px; padding: 25px 20px; color: white;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .title { font-size: 24px; font-weight: 600; color: #00ffd5; }

    /* Khung nhập tên & nội dung */
    .create-post { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 15px; margin-bottom: 20px; }
    .create-post input {
        width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
        color: white; margin-bottom: 10px; font-size: 14px; outline: none;
    }
    .create-post textarea {
        width: 100%; height: 80px; background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
        padding: 12px; color: white; resize: none; outline: none; font-size: 14px;
    }
    .post-btn {
        background: #00ffd5; color: #111827; border: none; padding: 10px 20px;
        border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; float: right;
    }

    /* Bài viết */
    .post-card {
        background: rgba(255, 255, 255, 0.05); border-radius: 16px;
        padding: 15px; margin-bottom: 15px; position: relative; clear: both;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-info .name { font-weight: 600; font-size: 14px; color: #00ffd5; }
    .user-info .time { font-size: 11px; color: #888; margin-left: 8px; }
    .post-content { font-size: 14px; margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
    .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">BẢNG TIN FIREBASE</div>
        </div>

        <!-- Khung Đăng Bài (Không cần Đăng Nhập) -->
        <div class="create-post">
            <input type="text" id="userInput" placeholder="Tên của bạn (Mặc định: Bắt danh)...">
            <textarea id="postInput" placeholder="Bạn đang nghĩ gì thế?..."></textarea>
            <button class="post-btn" id="postBtn">Đăng bài</button>
            <div style="clear:both;"></div>
        </div>

        <!-- Danh sách bài viết -->
        <div id="newsFeed">Đang tải dữ liệu từ Firebase...</div>
    </div>

    <!-- FIREBASE NO-AUTH MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2qJM8rMWEwCY5aAUJ-EgWc-GFleckSUI",
            authDomain: "mangxahoi-3620c.firebaseapp.com",
            projectId: "mangxahoi-3620c",
            storageBucket: "mangxahoi-3620c.firebasestorage.app",
            messagingSenderId: "794417692508",
            appId: "1:794417692508:web:f439e61c151c33415c4b99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsRef = collection(db, "posts");

        // ĐĂNG BÀI VIẾT LÊN FIREBASE
        document.getElementById("postBtn").onclick = async () => {
            const username = document.getElementById("userInput").value.trim() || "Ẩn danh";
            const content = document.getElementById("postInput").value.trim();

            if (!content) return alert("Vui lòng nhập nội dung bài viết!");

            try {
                await addDoc(postsRef, {
                    author: username,
                    content: content,
                    createdAt: Date.now()
                });
                document.getElementById("postInput").value = "";
            } catch (err) {
                alert("Lỗi không lưu được bài viết: " + err.message);
            }
        };

        // HIỂN THỊ BÀI VIẾT REAL-TIME
        const q = query(postsRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById("newsFeed");
            feed.innerHTML = "";

            if (snapshot.empty) {
                feed.innerHTML = "<p style='text-align:center;'>Chưa có bài viết nào.</p>";
                return;
            }

            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const id = docSnap.id;
                const timeStr = new Date(post.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const postHTML = `
                    <div class="post-card">
                        <button class="delete-btn" onclick="deletePost('${id}')">✕</button>
                        <div class="user-info">
                            <span class="name">${escapeHTML(post.author)}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                        <div class="post-content">${escapeHTML(post.content)}</div>
                    </div>
                `;
                feed.insertAdjacentHTML("beforeend", postHTML);
            });
        }, (err) => {
            document.getElementById("newsFeed").innerText = "Lỗi tải bài viết: " + err.message;
        });

        // XÓA BÀI VIẾT
        window.deletePost = async (id) => {
            if (confirm("Xóa bài viết này?")) {
                await deleteDoc(doc(db, "posts", id));
            }
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
