name: Build ChiDoi Apps (Windows EXE & Android APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD WINDOWS EXE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executable
        run: npx electron-builder --win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiDoi-Windows-Executable
          path: dist/*.exe

      - name: Create GitHub Release (Windows EXE)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: dist/*.exe
          tag_name: v1.0.${{ github.run_number }}-win
          name: Chi Đội Windows v1.0.${{ github.run_number }}
          body: |
            Bản cài đặt ứng dụng Chi Đội dành cho Windows (.exe) - Build #${{ github.run_number }}.
            Tải về và chạy trực tiếp.
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Check Chidoi Icon
        run: |
          echo "===== Kiểm tra icon ====="
          if [ ! -f "icon.png" ]; then
            echo "❌ KHÔNG TÌM THẤY icon.png"
            echo "Hãy đặt icon.png ở thư mục gốc repository."
            exit 1
          fi
          file icon.png
          ls -lh icon.png
          echo "✅ Đã tìm thấy icon.png"

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp icon.png www/icon.png
          echo "===== Nội dung www ====="
          ls -lah www

      - name: Initialize Node Project
        run: |
          npm init -y
          npm install \
            @capacitor/core@5.7.0 \
            @capacitor/cli@5.7.0 \
            @capacitor/android@5.7.0

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.anhsung.chidoi",
            "appName": "Chi Đội",
            "webDir": "www",
            "server": {
              "url": "https://anhsung986.github.io/chidoi/",
              "cleartext": true
            }
          }
          EOF
          echo "===== capacitor.config.json ====="
          cat capacitor.config.json

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Chidoi Android Icon
        run: |
          echo "===== Cài icon Chidoi ====="
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/drawable/chidoi_icon.png

          echo "===== Sửa AndroidManifest.xml ====="
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/chidoi_icon"|g' "$MANIFEST"
          sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@drawable/chidoi_icon"|g' "$MANIFEST"
          sed -i 's|android:label="@string/app_name"|android:label="Chidoi"|g' "$MANIFEST"

          if ! grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's|<application|<application android:icon="@drawable/chidoi_icon"|' "$MANIFEST"
          fi

      - name: Set App Name Chidoi
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Chidoi</string>|g' "$STRINGS"
          else
            mkdir -p android/app/src/main/res/values
            cat > "$STRINGS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Chidoi</string>
          </resources>
          EOF
          fi

      - name: Configure Android
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          if [ -f "variables.gradle" ]; then
            sed -i 's/minSdkVersion = .*/minSdkVersion = 22/' variables.gradle
          fi

      - name: Build Chidoi APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Chidoi.apk

      - name: Create GitHub Release (Android APK)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: output/Chidoi.apk
          tag_name: v1.0.${{ github.run_number }}-apk
          name: Chidoi APK v1.0.${{ github.run_number }}
          body: |
            # 📱 Chidoi APK - Build #${{ github.run_number }}

            APK được build tự động bằng GitHub Actions.

            ## Thông tin
            - 📱 App: Chidoi
            - 🎨 Icon: icon.png
            - 📦 Android APK
            - 🌐 Website: https://cd.chidoi.gt.tc/

            ## Cài đặt
            Tải `Chidoi.apk` và cài đặt trên thiết bị Android.
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
