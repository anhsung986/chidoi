name: Build ChiDoi Apps (Single Release)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD WINDOWS EXE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executable
        run: npx electron-builder --win

      # Đổi tên file .exe thành chidoi.exe
      - name: Rename Windows Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          $exeFile = Get-ChildItem -Path dist/*.exe | Select-Object -First 1
          if ($exeFile) {
            Copy-Item -Path $exeFile.FullName -Destination output/chidoi.exe
            Write-Host "✅ Đã đổi tên file Windows thành chidoi.exe"
          } else {
            Write-Error "❌ Không tìm thấy file .exe trong thư mục dist"
            exit 1
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: output/chidoi.exe

  # ==========================================
  # JOB 2: BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Check Chidoi Icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "❌ KHÔNG TÌM THẤY icon.png"
            exit 1
          fi

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp icon.png www/icon.png

      - name: Initialize Node Project
        run: |
          npm init -y
          npm install \
            @capacitor/core@5.7.0 \
            @capacitor/cli@5.7.0 \
            @capacitor/android@5.7.0

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.anhsung.chidoi",
            "appName": "Chi Đội",
            "webDir": "www",
            "server": {
              "url": "https://anhsung986.github.io/chidoi/",
              "cleartext": true
            }
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Chidoi Android Icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/drawable/chidoi_icon.png
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/chidoi_icon"|g' "$MANIFEST"
          sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@drawable/chidoi_icon"|g' "$MANIFEST"
          sed -i 's|android:label="@string/app_name"|android:label="Chi Đội"|g' "$MANIFEST"

      - name: Set App Name Chi Đội
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Chi Đội</string>|g' "$STRINGS"
          else
            mkdir -p android/app/src/main/res/values
            cat > "$STRINGS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Chi Đội</string>
          </resources>
          EOF
          fi

      - name: Configure Android
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Chidoi APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/ChiDoi.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: output/ChiDoi.apk

  # ==========================================
  # JOB 3: PUBLISH BOTH FILES TO 1 RELEASE
  # ==========================================
  publish-release:
    name: Create Combined Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: release-files/*
          tag_name: v1.0.${{ github.run_number }}
          name: Chi Đội v1.0.${{ github.run_number }}
          body: |
            ## 🚀 Chi Đội App - Build #${{ github.run_number }}

            > Bản phát hành tự động hỗ trợ cả hai hệ điều hành **Windows** và **Android**.

            ---

            ### 📦 Tệp cài đặt

            | Nền tảng | Tệp cài đặt | Hướng dẫn |
            | :--- | :--- | :--- |
            | 💻 **Windows** | `chidoi.exe` | Tải về và mở trực tiếp để chạy/cài đặt trên máy tính |
            | 📱 **Android** | `ChiDoi.apk` | Tải về, mở tệp và cho phép cài đặt ứng dụng **Chi Đội** |

            ---

            ### 🌐 Thông tin thêm
            * **Trang Website:** [cd.chidoi.gt.tc](https://cd.chidoi.gt.tc/)
            * **Trạng thái:** ✅ Stable Release
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
