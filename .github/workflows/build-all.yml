name: Build ChiDoi Apps (Single Release)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD WINDOWS EXE
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executable
        run: npx electron-builder --win

      - name: Rename Windows Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          $exeFile = Get-ChildItem -Path dist/*.exe | Select-Object -First 1
          if ($exeFile) {
            Copy-Item -Path $exeFile.FullName -Destination output/chidoi.exe
            Write-Host "✅ Đã đổi tên file Windows thành chidoi.exe"
          } else {
            Write-Error "❌ Không tìm thấy file .exe trong thư mục dist"
            exit 1
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: output/chidoi.exe

  # ==========================================
  # JOB 2: BUILD ANDROID APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Check Chidoi Icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "❌ KHÔNG TÌM THẤY icon.png"
            exit 1
          fi

      - name: Auto-Inject App Version from version.json
        run: |
          if [ -f "version.json" ]; then
            APP_VER=$(jq -r '.version' version.json)
            echo "📌 Phiên bản phát hiện từ version.json: $APP_VER"
            if [ -f "auth.html" ]; then
              sed -i "s/const CURRENT_VERSION = \".*\";/const CURRENT_VERSION = \"$APP_VER\";/g" auth.html
              echo "✅ Đã tự động cập nhật CURRENT_VERSION = \"$APP_VER\" vào auth.html"
            fi
          else
            echo "⚠️ Không tìm thấy version.json, giữ nguyên version mặc định."
          fi

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp icon.png www/icon.png

      - name: Initialize Node Project & Install Plugins
        run: |
          npm init -y
          npm install \
            @capacitor/core@5.7.0 \
            @capacitor/cli@5.7.0 \
            @capacitor/android@5.7.0 \
            @capacitor/push-notifications@5.1.0 \
            @capacitor/camera@5.0.9 \
            @capacitor/filesystem@5.1.4

      - name: Create Capacitor Config (Local Web Assets)
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.chidoi.appchidoi",
            "appName": "Chi Đội",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Chidoi Android Icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/drawable/chidoi_icon.png
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/chidoi_icon"|g' "$MANIFEST"
          sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@drawable/chidoi_icon"|g' "$MANIFEST"
          sed -i 's|android:label="@string/app_name"|android:label="Chi Đội"|g' "$MANIFEST"

      - name: Inject ALL App Permissions Safely to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          '
          python3 -c "
          with open('$MANIFEST', 'r') as f:
              content = f.read()
          if '<manifest' in content:
              parts = content.split('>', 1)
              new_content = parts[0] + '>' + '''$PERMISSIONS''' + parts[1]
              with open('$MANIFEST', 'w') as f:
                  f.write(new_content)
          "
          echo "✅ Đã bơm toàn bộ quyền vào Manifest thành công!"

      - name: Enable WebView Features & Auto Request Permissions (Java Level)
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -f "$MAIN_ACTIVITY" ]; then
            python3 -c "
            with open('$MAIN_ACTIVITY', 'r') as f:
                content = f.read()
            
            import_target = 'import com.getcapacitor.BridgeActivity;'
            new_imports = 'import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\nimport android.os.Build;'
            if import_target in content:
                content = content.replace(import_target, new_imports)
            
            target = 'super.onCreate(savedInstanceState);'
            addition = '''
                super.onCreate(savedInstanceState);
                this.bridge.getWebView().getSettings().setJavaScriptEnabled(true);
                this.bridge.getWebView().getSettings().setDomStorageEnabled(true);
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        requestPermissions(new String[]{
                            Manifest.permission.POST_NOTIFICATIONS,
                            Manifest.permission.CAMERA,
                            Manifest.permission.READ_MEDIA_IMAGES
                        }, 101);
                    }
                }
            '''
            if target in content:
                content = content.replace(target, addition)
            
            with open('$MAIN_ACTIVITY', 'w') as f:
                f.write(content)
            "
            echo "✅ Đã tiêm mã xin quyền Native thành công vào MainActivity.java!"
          else
            echo "⚠️ Không tìm thấy file MainActivity.java."
          fi

      - name: Set App Name Chi Đội
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Chi Đội</string>|g' "$STRINGS"
          else
            mkdir -p android/app/src/main/res/values
            cat > "$STRINGS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Chi Đội</string>
          </resources>
          EOF
          fi

      - name: Configure Android
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Chidoi APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/ChiDoi.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: output/ChiDoi.apk

  # ==========================================
  # JOB 3: PUBLISH BOTH FILES TO 1 RELEASE
  # ==========================================
  publish-release:
    name: Create Combined Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: release-files/*
          tag_name: v1.0.${{ github.run_number }}
          name: Chi Đội v1.0.${{ github.run_number }}
          body: |
            ## 🚀 Chi Đội App - Build #${{ github.run_number }}
            
            Bản APK đóng gói tự động nhận diện version từ version.json và tự động hỏi quyền Native khi vừa mở app.
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
