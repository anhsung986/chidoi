name: Build ChiDoi Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Executable
        run: npx electron-builder --win

      # 1. Lưu bản backup vào Artifacts
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiDoi-Windows-Executable
          path: dist/*.exe

      # 2. Tự động tạo Release mới với Tag tăng theo build number
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: dist/*.exe
          tag_name: v1.0.${{ github.run_number }}
          name: Chi Đội Windows v1.0.${{ github.run_number }}
          body: |
            Bản cài đặt ứng dụng Chi Đội dành cho Windows (.exe) - Build #${{ github.run_number }}.
            Tải về và chạy trực tiếp.
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
