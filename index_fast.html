<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="CHI ĐỘI">
  <title>Chào mừng đến với CHI ĐỘI</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <!-- Ưu tiên tải logo ngay từ đầu -->
  <link rel="preload" as="image" href="./icon.png" fetchpriority="high">

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0b0f19;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .logo-container {
      margin: 0 0 34px;
      text-align: center;
      /* Hiện logo ngay, không chờ hiệu ứng fade-in */
      opacity: 1;
      transform: none;
    }
    .logo-container img {
      display: block;
      width: min(260px, 72vw);
      height: min(260px, 72vw);
      object-fit: contain;
      border-radius: 38px;
      filter: drop-shadow(0 12px 28px rgba(0, 255, 213, .22));
    }
    .fallback-text {
      display: none;
      font-size: clamp(42px, 12vw, 72px);
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(45deg, #ff4d9d, #00ffd5, #7a00ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .progress-bar-container {
      width: min(300px, 72vw);
      height: 7px;
      margin-bottom: 13px;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,.12);
    }
    .progress-bar {
      width: 8%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00ffd5, #7a00ff);
      transition: width .12s linear;
      will-change: width;
    }
    .status-text {
      min-height: 20px;
      color: #9ca3af;
      font-size: 13px;
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-bar { transition: none; }
    }
  </style>

  <!-- Không để SDK thông báo chặn việc hiển thị logo hoặc mở ứng dụng -->
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function (OneSignal) {
      try {
        await OneSignal.init({
          appId: "62c6a850-ef65-4fcb-9a8c-608c3f15acc2"
        });
      } catch (error) {
        console.warn("OneSignal chưa khởi tạo được:", error);
      }
    });
  </script>
  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
  ></script>
</head>
<body>
  <main class="logo-container">
    <img
      src="./icon.png"
      alt="Logo Chi Đội"
      id="logoImg"
      width="260"
      height="260"
      fetchpriority="high"
      decoding="async"
      onerror="showFallbackLogo()"
    >
    <div class="fallback-text" id="fallbackText">CHI ĐỘI</div>
  </main>

  <div class="progress-bar-container" aria-label="Đang mở ứng dụng">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="status-text" id="statusText" role="status" aria-live="polite">Đang mở CHI ĐỘI...</div>

  <script>
    function showFallbackLogo() {
      document.getElementById("logoImg").style.display = "none";
      document.getElementById("fallbackText").style.display = "block";
    }

    // Giữ tương thích với màu giao diện đã lưu.
    try {
      const savedColor = localStorage.getItem("app_theme_color");
      if (savedColor) {
        document.documentElement.style.setProperty("--app-primary-color", savedColor);
      }
    } catch (_) {}

    // Bỏ thời gian chờ 5 giây và phần trăm tải giả ngẫu nhiên.
    // Chỉ chờ logo tải/giải mã trong thời gian ngắn; không chờ OneSignal.
    const bar = document.getElementById("progressBar");
    const status = document.getElementById("statusText");
    const logo = document.getElementById("logoImg");
    let redirected = false;

    function openApp() {
      if (redirected) return;
      redirected = true;
      bar.style.width = "100%";
      status.textContent = "Đã sẵn sàng!";
      setTimeout(() => {
        window.location.replace("./auth.html");
      }, 120);
    }

    const logoReady = logo.decode
      ? logo.decode().catch(() => {})
      : new Promise(resolve => {
          if (logo.complete) resolve();
          else {
            logo.addEventListener("load", resolve, { once: true });
            logo.addEventListener("error", resolve, { once: true });
          }
        });

    bar.style.width = "45%";
    Promise.race([
      logoReady,
      new Promise(resolve => setTimeout(resolve, 450))
    ]).then(() => {
      bar.style.width = "85%";
      status.textContent = "Đang mở ứng dụng...";
      openApp();
    });

    // Nếu thiết bị tải ảnh rất chậm, vẫn tiếp tục mở app.
    setTimeout(openApp, 650);
  </script>
</body>
</html>
